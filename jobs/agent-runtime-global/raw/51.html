    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Member of Technical Staff, North Modelling (Evals)","description":"<h2><strong>Who are we?</strong></h2><p style=\"min-height:1.5em\">Cohere is the leading security-first enterprise AI company.  We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.</p><p style=\"min-height:1.5em\">We’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.</p><p style=\"min-height:1.5em\">We obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.</p><p style=\"min-height:1.5em\">We are a global technology company headquartered in Toronto with key offices in London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul. Join us!</p><h1> </h1><p style=\"min-height:1.5em\"><strong>Role overview:</strong><br /><br />North is Cohere’s AI workspace platform for enterprises: a secure, customizable environment where companies can use AI across their real workflows while maintaining control over sensitive data. North connects AI agents with workplace tools, applications, and business context, helping users delegate complex work, build automations, inspect outputs, and collaborate with AI in production environments.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">As North becomes more capable, one of the most important questions is also one of the hardest: how do we know whether the model is actually getting better for the workflows customers care about?</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">This role is about being the voice of North inside modelling. You will build the evaluation systems, feedback loops, and applied modelling workflows that make sure model progress translates into better product outcomes for North users. You will work closely with North product teams, customer-facing teams, and modelling teams to define what “good” means across the product surface, turn real usage and product direction into high-quality evals, and use those evals to guide model selection, patches, and regular model updates.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">This is neither a pure research role nor a conventional product engineering role. It is a rigorous applied MLE role for someone who cares deeply about measurement, model behavior, and real-world product quality. You should be excited by the craft of building careful evals: evals that capture messy agentic workflows, reflect actual customer needs, resist superficial benchmark hacking, and provide useful signal for where the product and models need to go next.<br /></p><p style=\"min-height:1.5em\"><em>Please note: this team works closely across Europe and East Coast North America time zones. We are open to candidates who can collaborate effectively within those hours.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Key responsibilities:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Own the eval strategy for North: define what we need to measure across agent workflows, tool use, enterprise knowledge work such as deep research, document creation or editing, and other human-AI interactions.</p></li><li><p style=\"min-height:1.5em\">Build high-quality evals from the realities of the product: user feedback, production failures, privacy-preserving usage logs, internal dogfooding, customer needs, and forward-looking product goals.</p></li><li><p style=\"min-height:1.5em\">Create systems that continuously turn what North is learning from users, customers, and feature teams into evals, so measurement keeps pace with the product rather than becoming a static benchmark.</p></li><li><p style=\"min-height:1.5em\">Be the voice of North inside modelling: extract clear insight from eval results, customer-derived data and product context, then turn model failures, capability gaps, and North-specific needs into actionable recommendations for the central modelling teams.<br /></p></li></ul><p style=\"min-height:1.5em\"><strong>Qualifications:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have improved LLM-powered, agent-powered, or AI-product systems through evals, feedback loops, data curation, prompting, model adaptation, or model selection.</p></li><li><p style=\"min-height:1.5em\">You care deeply about evaluation as a craft: representative tasks, precise rubrics, clean data, failure analysis, regression tracking, and knowing when a metric is giving false confidence.</p></li><li><p style=\"min-height:1.5em\">You have strong applied MLE judgment and can reason clearly about model behavior, eval validity, product outcomes, and production tradeoffs.</p></li><li><p style=\"min-height:1.5em\">You are comfortable working close to users and product teams, while translating messy qualitative signals into measurement that other modelling teams can act on.</p></li><li><p style=\"min-height:1.5em\">You are self-directed, practical, and motivated by open-ended problems where the right answer requires both technical depth and product understanding.</p></li><li><p style=\"min-height:1.5em\">You care about making AI systems genuinely useful in real enterprise settings, not just better on abstract benchmarks.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">If some of the above does not line up perfectly with your experience, we still encourage you to apply.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Working Location:</strong><br />This role can be based remotely or from one of our office locations listed on the job description - there is no minimum in-office qualification requirement. We care most about hiring exceptional people regardless of locations, though please check the location listed on the posting for guidance around the core time zone or working hours alignment expected for the role.</p><p style=\"min-height:1.5em\"></p><h2><strong>Full-Time Employees at Cohere enjoy these Perks:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.</p></li><li><p style=\"min-height:1.5em\">Full health and dental benefits, including a separate budget for mental health.</p></li><li><p style=\"min-height:1.5em\">RRSP matching, 401K, Pension Scheme.</p></li><li><p style=\"min-height:1.5em\">100% Parental Leave top-up for up to 6 months, for either parent.</p></li><li><p style=\"min-height:1.5em\">Annual enrichment benefits:</p><p style=\"min-height:1.5em\">Arts &amp; culture, fitness/wellness, quality time, and a workspace improvement credit.</p><p style=\"min-height:1.5em\">Education &amp; learning stipend for conferences, courses, and coaching.</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">6 weeks of paid vacation (30 working days!)</p></li><li><p style=\"min-height:1.5em\">Budget for traveling to other offices if you are remote, plus an annual company offsite.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>How and Where We Work:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.</p></li><li><p style=\"min-height:1.5em\">For those in the office: a daily lunch program, plenty of snacks, and regular community and social events.</p></li><li><p style=\"min-height:1.5em\">For those not near an office: a co-working benefit so you can work alongside others in your city.</p></li><li><p style=\"min-height:1.5em\">Everyone receives a $500 home office stipend to set up your workspace properly.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">If any of the above doesn’t line up exactly with your experience, we still encourage you to apply. </p><p style=\"min-height:1.5em\"><br />We strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://docs.google.com/forms/d/12a6IrLdF3kI2nonKSr4tiFuz18rLQbaeYV-JM9L4o9Q/edit\"> Accommodations Request Form</a>, and we will work together to meet your needs.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn't limit the applications our recruiters may review or consider.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Beware of Scams: Cohere will never ask for payment or third-party services (e.g., CV writing) as part of our hiring process. All legitimate roles are listed on the Cohere careers page and LinkedIn only, with all communications from Cohere employees coming from an @cohere.com or @cw.cohere email alias. If jobs are viewed on other sites then please verify these through our </em><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cohere.com/careers\"><em>official careers</em></a><em> page.</em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Cohere","value":"60de50e9-aba7-4a3a-8cdb-955a456749aa"},"datePosted":"2026-08-19","hiringOrganization":{"@type":"Organization","name":"Cohere","sameAs":"https://cohere.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/951a1fca-ef74-47dd-9932-d2e6ae54beb2/c275a67b-c32a-426c-bc5a-e64c488df273/f9bad60a-761a-4d26-9d99-39bda6bbaed4.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"London","addressRegion":"London","addressCountry":"United Kingdom"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":[{"@type":"Country","name":"European Union"},{"@type":"Country","name":"Canada"},{"@type":"Country","name":"United Kingdom"}]}</script>
