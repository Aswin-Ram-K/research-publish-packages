# --- the archive-index row, and the vocabulary -------------------------------
# index_row is this package's row in the destination's root README index. The
# root README is an index, not any one package's README: each package ships its
# own README.md. The index is assembled from every manifest whose package is
# present, so a second build ADDS a row instead of overwriting the first, and
# the rows are ordered by manifest slug. The vocabulary fragments are
# byte-identical to the built-in default package's: the payload is the same
# package, so its declared vocabulary genuinely describes it.
index_row = "| [encoder-crossover-190](packages/encoder-crossover-190/) | Encoder-crossover-190 data + verification package (same payload, paper #3 path) |"
vocabulary_code = "encoder-crossover-190/vocabulary-code.txt"
vocabulary_public = "encoder-crossover-190/vocabulary-public.txt"

