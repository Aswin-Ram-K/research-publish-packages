  <meta name="description" content="About the team
The Agent Post-Training team creates the frontier agents OpenAI ships to the world. We are training the models behind our agents in Codex, ChatGPT, the API, and other frontier products: persistent, proactive intelligence that can operate computers, collaborate with people and other agents, and expand what people and organizations can imagine, attempt, and achieve.

We define what the next generation of agents should be able to do, build the training signal that teaches those abilities, and run the experiments that make them real. Our work spans coding, tool use, computer use, multi-agent coordination, long-horizon execution, factuality, instruction following, calibrated reasoning, and taste.

Our team is where new model capabilities get made. We build the data, environments, graders, training methods, and feedback loops that shape what OpenAI&#39;s next agents can do, then carry those capabilities through major training runs and into the products people use.

About the Role

As a researcher working on Frontier Evals &amp; Environments, you will help build north star model environments to drive progress towards safe AGI/ASI. Your work will directly guide the research programs of the most ambitious training runs happening at OpenAI. Some prior open-sourced evaluations built by researchers in this role include GDPval https://openai.com/index/gdpval/, SWE-bench Verified https://openai.com/index/introducing-swe-bench-verified/, MLE-bench https://openai.com/index/mle-bench/, PaperBench https://openai.com/index/paperbench/, and SWE-Lancer https://openai.com/index/swe-lancer/. If you are interested in feeling firsthand the fast progress of our models, and steering them towards good outcomes, this is the role for you.

You will work with researchers, engineers, product teams, infrastructure teams, and safety/alignment partners to decide what should go into major model runs, measure whether it worked, and ship improvements into products used by real people. This is a high-agency role for people who want their work to land directly in frontier models.


In this role, you&#39;ll:

 - Create ambitious RL environments to push our models to their limits, and measure frontier model capabilities, skills, and behaviors

 - Develop new methodologies for automatically exploring the behavior of these models

 - Dive deep into the science of measurement, including understanding scalability, reliability, and variance of our evaluation methodology

 - Help steer training for our largest training runs, and see the future first

 - Design scalable systems and processes to support continuous evaluation

 - Build self-improvement loops to automate model understanding

You might thrive in this role if you

 - Have strong technical fundamentals in machine learning, software engineering, systems, statistics, or a related field, and can learn quickly across the parts you have not worked in before.

 - Have hands-on experience with LLMs, RL, RLHF/RLAIF, post-training, evals, graders, synthetic data, model training, coding agents, tool-using agents, or production ML systems.

 - Are excited by open-ended problems where the path is unclear, the signal is noisy, and the right answer requires both research taste and engineering execution.

 - Care about product impact and model behavior, not just benchmark movement. You have opinions about what makes an agent useful, reliable, honest, tasteful, and easy to work with.

 - Can move from a vague behavioral problem to a concrete experiment: define the hypothesis, build the pipeline, run the model, analyze the result, and decide what to do next.

 - Are comfortable working across research, product, infrastructure, data, evals, and safety boundaries, and can communicate clearly with each group.

 - Like building load-bearing systems and processes when that is what the team needs, even if the work is not glamorous.

 - Want to train and ship the models that make agents genuinely useful for developers, enterprises, researchers, and everyday users.

About OpenAI

OpenAI is an AI research and deployment company dedicated to ensuring that general-purpose artificial intelligence benefits all of humanity. We push the boundaries of the capabilities of AI systems and seek to safely deploy them to the world through our products. AI is an extremely powerful tool that must be created with safety and human needs at its core, and to achieve our mission, we must encompass and value the many different perspectives, voices, and experiences that form the full spectrum of humanity. 

We are an equal opportunity employer, and we do not discriminate on the basis of race, religion, color, national origin, sex, sexual orientation, age, veteran status, disability, genetic information, or other applicable legally protected characteristic. 

For additional information, please see OpenAI’s Affirmative Action and Equal Employment Opportunity Policy Statement https://cdn.openai.com/policies/eeo-policy-statement.pdf.

Background checks for applicants will be administered in accordance with applicable law, and qualified applicants with arrest or conviction records will be considered for employment consistent with those laws, including the San Francisco Fair Chance Ordinance, the Los Angeles County Fair Chance Ordinance for Employers, and the California Fair Chance Act, for US-based candidates. For unincorporated Los Angeles County workers: we reasonably believe that criminal history may have a direct, adverse and negative relationship with the following job duties, potentially resulting in the withdrawal of a conditional offer of employment: protect computer hardware entrusted to you from theft, loss or damage; return all computer hardware in your possession (including the data contained therein) upon termination of employment or end of assignment; and maintain the confidentiality of proprietary, confidential, and non-public information. In addition, job duties require access to secure and protected information technology systems and related data security obligations.

To notify OpenAI that you believe this job posting is non-compliant, please submit a report through this form https://form.asana.com/?d=57018692298241&amp;k=5MqR40fZd7jlxVUh5J-UeA. No response will be provided to inquiries unrelated to job posting compliance.

We are committed to providing reasonable accommodations to applicants with disabilities, and requests can be made via this link https://form.asana.com/?k=bQ7w9h3iexRlicUdWRiwvg&amp;d=57018692298241.

build the data, environments, graders, training methods, and feedback loops that shape what OpenAI's next agents can do, then carry those capabilities through major training runs and into the products people use.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About the Role</strong></p><p style=\"min-height:1.5em\">As a researcher working on Frontier Evals &amp; Environments, you will help build north star model environments to drive progress towards safe AGI/ASI. Your work will directly guide the research programs of the most ambitious training runs happening at OpenAI. Some prior open-sourced evaluations built by researchers in this role include <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://openai.com/index/gdpval/\"><u>GDPval</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://openai.com/index/introducing-swe-bench-verified/\"><u>SWE-bench Verified</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://openai.com/index/mle-bench/\"><u>MLE-bench</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://openai.com/index/paperbench/\"><u>PaperBench</u></a>, and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://openai.com/index/swe-lancer/\"><u>SWE-Lancer</u></a>. If you are interested in feeling firsthand the fast progress of our models, and steering them towards good outcomes, this is the role for you.</p><p style=\"min-height:1.5em\">You will work with researchers, engineers, product teams, infrastructure teams, and safety/alignment partners to decide what should go into major model runs, measure whether it worked, and ship improvements into products used by real people. This is a high-agency role for people who want their work to land directly in frontier models.<br /></p><p style=\"min-height:1.5em\"><strong>In this role, you'll:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Create ambitious RL environments to push our models to their limits, and measure frontier model capabilities, skills, and behaviors</p></li><li><p style=\"min-height:1.5em\">Develop new methodologies for automatically exploring the behavior of these models</p></li><li><p style=\"min-height:1.5em\">Dive deep into the science of measurement, including understanding scalability, reliability, and variance of our evaluation methodology</p></li><li><p style=\"min-height:1.5em\">Help steer training for our largest training runs, and see the future first</p></li><li><p style=\"min-height:1.5em\">Design scalable systems and processes to support continuous evaluation</p></li><li><p style=\"min-height:1.5em\">Build self-improvement loops to automate model understanding</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\"><strong>You might thrive in this role if you</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Have strong technical fundamentals in machine learning, software engineering, systems, statistics, or a related field, and can learn quickly across the parts you have not worked in before.</p></li><li><p style=\"min-height:1.5em\">Have hands-on experience with LLMs, RL, RLHF/RLAIF, post-training, evals, graders, synthetic data, model training, coding agents, tool-using agents, or production ML systems.</p></li><li><p style=\"min-height:1.5em\">Are excited by open-ended problems where the path is unclear, the signal is noisy, and the right answer requires both research taste and engineering execution.</p></li><li><p style=\"min-height:1.5em\">Care about product impact and model behavior, not just benchmark movement. You have opinions about what makes an agent useful, reliable, honest, tasteful, and easy to work with.</p></li><li><p style=\"min-height:1.5em\">Can move from a vague behavioral problem to a concrete experiment: define the hypothesis, build the pipeline, run the model, analyze the result, and decide what to do next.</p></li><li><p style=\"min-height:1.5em\">Are comfortable working across research, product, infrastructure, data, evals, and safety boundaries, and can communicate clearly with each group.</p></li><li><p style=\"min-height:1.5em\">Like building load-bearing systems and processes when that is what the team needs, even if the work is not glamorous.</p></li><li><p style=\"min-height:1.5em\">Want to train and ship the models that make agents genuinely useful for developers, enterprises, researchers, and everyday users.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About OpenAI</strong></p><p style=\"min-height:1.5em\">OpenAI is an AI research and deployment company dedicated to ensuring that general-purpose artificial intelligence benefits all of humanity. We push the boundaries of the capabilities of AI systems and seek to safely deploy them to the world through our products. AI is an extremely powerful tool that must be created with safety and human needs at its core, and to achieve our mission, we must encompass and value the many different perspectives, voices, and experiences that form the full spectrum of humanity. </p><p style=\"min-height:1.5em\">We are an equal opportunity employer, and we do not discriminate on the basis of race, religion, color, national origin, sex, sexual orientation, age, veteran status, disability, genetic information, or other applicable legally protected characteristic. </p><p style=\"min-height:1.5em\">For additional information, please see <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"c-link c-link--underline\" href=\"https://cdn.openai.com/policies/eeo-policy-statement.pdf\"><u>OpenAI’s Affirmative Action and Equal Employment Opportunity Policy Statement</u></a>.</p><p style=\"min-height:1.5em\">Background checks for applicants will be administered in accordance with applicable law, and qualified applicants with arrest or conviction records allenges, and we want the upside of AI to be widely shared. Join us in shaping the future of technology.</p>","isListed":true,"isConfidential":false,"teamNames":["Research","Agents"],"secondaryLocationNames":[],"compensationTierSummary":"$295K – $380K • Offers Equity","compensationTiers":[{"id":"3aefe6d7-f603-4986-875d-68feeae355d9","title":null,"tierSummary":"San Francisco $295K – $380K • Offers Equity","__typename":"JobPostingCompensationTiers"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$295K - $380K","compensationPhilosophyHtml":"<p style=\"min-height:1.5em\">The base pay offered may vary depending on multiple individualized factors, including market location, job-related knowledge, skills, and experience. If the role is non-exempt, overtime pay will be provided consistent with applicable laws.  In addition to the salary range listed above, total compensation also includes generous equity, performance-related bonus(es) for eligible employees, and the following benefits.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Medical, dental, and vision insurance for you and your family, with employer contributions to Health Savings Accounts</p></li><li><p style=\"min-height:1.5em\">Pre-tax accounts for Health FSA, Dependent Care FSA, and commuter expenses (parking and transit)</p></li><li><p style=\"min-height:1.5em\">401(k) retirement plan with employer match</p></li><li><p style=\"min-height:1.5em\">Paid parental leave (up to 24 weeks for birth parents and 20 weeks for non-birthing parents), plus paid medical and caregiver leave (up to 8 weeks)</p></li><li><p style=\"min-height:1.5em\">Paid time off: flexible PTO for exempt employees and up to 15 days annually for non-exempt employees</p></li><li><p style=\"min-height:1.5em\">13+ paid company holidays, and multiple paid coordinated company office closures throughout the year for focus and recharge, plus paid sick or safe time (1 hour per 30 ho
