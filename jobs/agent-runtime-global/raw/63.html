    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Machine Learning Engineer, Evals","description":"<p style=\"min-height:1.5em\"><strong>The Role</strong></p><p style=\"min-height:1.5em\">You'll work across the lab on agent capability evals, benchmark design, LLM-as-judge systems, failure analysis, and the infrastructure that ties it together. This is a high-growth, high-ownership role on a small team, and you'll ship evaluation infrastructure that researchers depend on from day one.</p><p style=\"min-height:1.5em\"><strong>Responsibilities</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Run the full eval pipeline end to end and reproduce known results during onboarding, pairing with a senior engineer on your first task</p></li><li><p style=\"min-height:1.5em\">Build a judge calibration protocol: sample human-labeled decisions, measure agreement (κ, per-class P/R), identify drift zones, and document it so anyone can re-run it</p></li><li><p style=\"min-height:1.5em\">Extend an existing benchmark (GAIA, τ-Bench, SWE-bench slice, etc.) with new tasks targeting known capability gaps, including the prompt, environment, rubric, automated grader, and QA</p></li><li><p style=\"min-height:1.5em\">Run failure analysis on model outputs: categorize failure modes, quantify prevalence, and write up findings with recommendations for training data, judge prompts, or benchmark changes</p></li><li><p style=\"min-height:1.5em\">Own a recurring eval workflow (weekly regression suite, judge drift dashboard, red-team evaluation for a new capability) and ship tooling researchers actually use</p></li></ul><p style=\"min-height:1.5em\"><strong>Qualifications</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in software engineering, ML engineering, data science, or a research-adjacent role, with concrete evaluation experience from coursework, an internship, a side project, open source work, or a job</p></li><li><p style=\"min-height:1.5em\">Experience with at least one LLM evaluation framework (Harbor, Nemo Evaluator, etc.), with real opinions on what it does well and where it falls short</p></li><li><p style=\"min-height:1.5em\">Hands-on experience with LLMs: prompting, few-shot design, and ideally fine-tuning or RAG; regular use of coding agents</p></li><li><p style=\"min-height:1.5em\">Solid Python. You write clean, tested, version-controlled code that a colleague could run without you babysitting it</p></li><li><p style=\"min-height:1.5em\">Comfort with Git, CI/CD basics, Docker, and the Linux command line (SSH, tmux, debugging a remote job)</p></li><li><p style=\"min-height:1.5em\">Understanding of basic eval statistics: why accuracy misleads on imbalanced judges, what Cohen's κ measures, how to think about confidence intervals on a metric</p></li><li><p style=\"min-height:1.5em\">At least 3 of the following: you can explain why LLM-as-judge needs calibration; you've done failure analysis and can tell model bugs apart from prompt, grader, or retrieval issues; you know at least two agent benchmarks (GAIA, AgentBench, τ-Bench, MINT, SWE-bench, WebShop, ALFWorld) and a limitation of each; you've designed or extended an eval dataset with happy paths, edge cases, and adversarial examples; you've thought about non-determinism in eval, how you sample, how many runs, how you report variance</p></li><li><p style=\"min-height:1.5em\">You communicate clearly to both researchers and engineers, in the right language for each</p></li><li><p style=\"min-height:1.5em\">You're comfortable with ambiguity, can turn a half-formed request into a plan, and know when to ask for help</p></li></ul><p style=\"min-height:1.5em\"><strong>Preferred</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">RLVR / RLHF pipeline experience</p></li><li><p style=\"min-height:1.5em\">Training data curation experience</p></li><li><p style=\"min-height:1.5em\">Distributed eval orchestration experience</p></li><li><p style=\"min-height:1.5em\">Benchmark design from scratch</p></li><li><p style=\"min-height:1.5em\">Red teaming and adversarial eval experience</p></li><li><p style=\"min-height:1.5em\">Familiarity with psychometrics or measurement theory</p></li></ul>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Nous Research","value":"1e647dc1-e69c-4764-8a02-7244b8faee0b"},"datePosted":"2026-08-13","hiringOrganization":{"@type":"Organization","name":"Nous Research","sameAs":"https://nousresearch.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/b8c5086f-facc-4569-8fe9-c54ef68480f2/e3cfa9b7-3a5f-41dc-9b95-7cbfaca57482/1fcc39a5-a624-4b6b-be3e-badf1c69bd79.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"United States"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"}}</script>
