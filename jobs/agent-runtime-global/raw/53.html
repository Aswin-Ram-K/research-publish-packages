    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Member of Technical Staff, Agentic Environments ","description":"<h2><strong>Who are we?</strong></h2><p style=\"min-height:1.5em\">Cohere is the leading security-first enterprise AI company.  We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.</p><p style=\"min-height:1.5em\">We’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.</p><p style=\"min-height:1.5em\">We obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.</p><p style=\"min-height:1.5em\">We are a global technology company headquartered in Toronto with key offices in London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul. Join us!</p><p style=\"min-height:1.5em\"><br /><strong>Role Overview:<br /></strong>At Cohere, we're pushing the boundaries of what these technologies can achieve for production environments, and we're seeking a senior engineer who understands the practical challenges of making AI systems work at scale. This role demands deep technical expertise in production environments and the ability to bridge research concepts with real-world implementations.</p><p style=\"min-height:1.5em\">This position is hands-on and engineering-driven. You'll focus on production systems, experiment with frontier models, and collaborate with talented engineers to build scalable, production ready solutions. We strive for excellence in both engineering and science by meticulously designing experiments and design docs. We blend engineering and research seamlessly. Everyone contributes to both, depending on organizational needs. We provide access to world class compute resources, data, and talent to ensure you can do your best work. This role is perfect for you if you:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Have a deep passion for quality work.</p></li><li><p style=\"min-height:1.5em\">Enjoy tuning and optimising large LLM models.</p></li><li><p style=\"min-height:1.5em\">Comfortable working with people with different levels of software engineering skills, from beginner to more advanced.</p></li><li><p style=\"min-height:1.5em\">Comfortable diving into complex ML codebases to identify and resolve issues, ensuring the smooth operation of our systems.</p></li><li><p style=\"min-height:1.5em\">Thrive in a fast-paced, technically challenging environment, where you can contribute your innovative ideas and solutions.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Key responsibilities:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and write high-performing and scalable software for training models.</p></li><li><p style=\"min-height:1.5em\">Develop new tools to support and accelerate research and LLM training.</p></li><li><p style=\"min-height:1.5em\">Coordinate with other engineering teams (Infrastructure, Efficiency, Serving) and the scientific teams (Agent, Multimodal, Multilingual, etc.).</p></li><li><p style=\"min-height:1.5em\">Research, implement, and experiment with ideas on our cluster and data infrastructure.</p></li><li><p style=\"min-height:1.5em\">Collaborate, Collaborate, and Collaborate with other scientists, engineers, and teams!</p></li></ul><p style=\"min-height:1.5em\"><br /><strong>Qualifications:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Extremely strong software engineering skills.</p></li><li><p style=\"min-height:1.5em\">Value test-driven development methods, clean code, and strive to reduce technical debts at all levels.</p></li><li><p style=\"min-height:1.5em\">Proficiency in Python and related ML frameworks such as JAX, Pytorch and/or XLA/MLIR.</p></li><li><p style=\"min-height:1.5em\">Experience using and debugging large-scale distributed training strategies (memory/speed profiling).</p></li><li><p style=\"min-height:1.5em\">Experience with distributed training infrastructures (Kubernetes) and associated frameworks (Ray).</p></li><li><p style=\"min-height:1.5em\">Experience in ML and LLM academic research.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Working Location:</strong><br />This role can be based remotely or from one of our office locations listed on the job description - there is no minimum in-office qualification requirement. We care most about hiring exceptional people regardless of locations, though please check the location listed on the posting for guidance around the core time zone or working hours alignment expected for the role.</p><p style=\"min-height:1.5em\"></p><h2><strong>Full-Time Employees at Cohere enjoy these Perks:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.</p></li><li><p style=\"min-height:1.5em\">Full health and dental benefits, including a separate budget for mental health.</p></li><li><p style=\"min-height:1.5em\">RRSP matching, 401K, Pension Scheme.</p></li><li><p style=\"min-height:1.5em\">100% Parental Leave top-up for up to 6 months, for either parent.</p></li><li><p style=\"min-height:1.5em\">Annual enrichment benefits:</p><p style=\"min-height:1.5em\">Arts &amp; culture, fitness/wellness, quality time, and a workspace improvement credit.</p><p style=\"min-height:1.5em\">Education &amp; learning stipend for conferences, courses, and coaching.</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">6 weeks of paid vacation (30 working days!)</p></li><li><p style=\"min-height:1.5em\">Budget for traveling to other offices if you are remote, plus an annual company offsite.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>How and Where We Work:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.</p></li><li><p style=\"min-height:1.5em\">For those in the office: a daily lunch program, plenty of snacks, and regular community and social events.</p></li><li><p style=\"min-height:1.5em\">For those not near an office: a co-working benefit so you can work alongside others in your city.</p></li><li><p style=\"min-height:1.5em\">Everyone receives a $500 home office stipend to set up your workspace properly.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">If any of the above doesn’t line up exactly with your experience, we still encourage you to apply. </p><p style=\"min-height:1.5em\"><br />We strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://docs.google.com/forms/d/12a6IrLdF3kI2nonKSr4tiFuz18rLQbaeYV-JM9L4o9Q/edit\"> Accommodations Request Form</a>, and we will work together to meet your needs.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn't limit the applications our recruiters may review or consider.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Beware of Scams: Cohere will never ask for payment or third-party services (e.g., CV writing) as part of our hiring process. All legitimate roles are listed on the Cohere careers page and LinkedIn only, with all communications from Cohere employees coming from an @cohere.com or @cw.cohere email alias. If jobs are viewed on other sites then please verify these through our </em><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cohere.com/careers\"><em>official careers</em></a><em> page.</em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Cohere","value":"8878b0d0-7d88-4ee9-bc17-b0dd237e39a0"},"datePosted":"2026-08-13","hiringOrganization":{"@type":"Organization","name":"Cohere","sameAs":"https://cohere.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/951a1fca-ef74-47dd-9932-d2e6ae54beb2/c275a67b-c32a-426c-bc5a-e64c488df273/f9bad60a-761a-4d26-9d99-39bda6bbaed4.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"European Union"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":[{"@type":"Country","name":"Canada"},{"@type":"Country","name":"United States"},{"@type":"Country","name":"European Union"}]}</script>
