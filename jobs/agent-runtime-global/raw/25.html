    <title>Senior Software Engineer - LLM Ops &amp; Evals @ DataSnipper</title><meta name="title" content="Senior Software Engineer - LLM Ops &amp; Evals @ DataSnipper" />
    
  
  <meta name="description" content="Every AI call in DataSnipper goes through us. Product teams do not talk to model providers directly, they talk to our gateway. We are responsible for how inference is routed, how it fails over, what it costs, and how anyone can tell whether the output is any good.

The second half of the job is evaluation. We are building the platform teams use to measure AI quality: versioned datasets, experiment tracking, and evaluation runs they can act on. It is a hard problem and largely an open one, so you will have real influence over how we solve it.

This is a small team with a large blast radius. You will own real production systems, set the standards other teams build against, and see your work in front of hundreds of thousands of users in audit and finance.


ABOUT DATASNIPPER

Audit and finance are still massively manual and we are changing that. DataSnipper is a $1B, bootstrapped unicorn with 600,000+ users across 180+ countries, already embedded in the daily workflows of top audit and accounting firms.
Now, we are taking things further with our Excel Agent, bringing AI directly into where the work actually happens. Unlike generic AI tools, we do not sit on the sidelines. Our AI operates inside Excel, with access to real documents and audit evidence, meaning it does not just generate answers, it does the work, with full traceability.
We are not just applying AI, we are redefining how audit gets done. If you want to build something category-defining at scale, this is the place.


WHAT YOU WILL DO


TECHNICAL DELIVERY

 - Own the LLM gateway: routing, provider failover, rate limits, retries, and cost attribution across multiple model providers

 - Deploy, version and deprecate models across clouds, regions and environments, including quota and capacity planning, managed as infrastructure as code

 - Build the shared evaluation platform: versioned datasets, experiment tracking, run and result schemas, reporting, and trace linkage back to the run

 - Own the infrastructure for async and long-running AI workloads


RELIABILITY, SECURITY &amp; ON-CALL

 - Own observability for AI traffic: latency, retries and fallbacks, token usage, cost and errors, per team and per use case

 - Take part in the on-call rotation, run incidents, and close the follow-ups

 - Implement the security and compliance controls the platform is held to: retention, access control, RBAC and SSO


COLLABORATION &amp; IMPACT

 - Define and maintain clean integration contracts between the platform and the teams that consume it

 - Partner with product and ML engineers to turn their requirements into platform capabilities that are self-service rather than a request queue


WHAT YOU WILL BRING


MUST-HAVE

 - 5+ years in backend or platform engineering, with strong production Python

 - Experience building or running LLM inference infrastructure: a gateway or routing layer with multiple providers, failover, rate limiting and cost attribution

 - Experience with cloud at the infrastructure level and infrastructure as code (we run across Azure and GCP with Terraform)

 - Experience running a shared service in production: on-call, incidents, postmortems, SLOs

 - Hands-on experience with observability tools (OpenTelemetry, Grafana), including instrumenting services and designing dashboards and alerts

 - Comfort with privacy and compliance work: PII handling, anonymisation, retention, access control

 - Experience building platform or shared-service capabilities consumed by multiple internal teams


NICE-TO-HAVE

 - Experience with LLM or agent evaluation

 - Temporal or another durable workflow engine

 - Self-hosted inference, capacity planning, load testing

 - Synthetic data or document anonymisation pipelines

 - Document AI: VLMs, OCR, structured extraction and the metrics that go with it

 - Domain experience in audit, accounting or fintech


WHAT WE EXPECT

 - Ownership: You own work end-to-end, anticipate issues, and ensure high-quality delivery without close supervision

 - Growth Mindset: You encourage open feedback exchange and provide clear, balanced feedback that helps others grow

 - Collaboration: You build strong cross-functional relationships and influence peers through expertise, data, and empathy

 - Adaptability: You navigate ambiguity calmly, model positive behavior, and help peers adjust through clear communication

 - Judgment: You exercise sound judgment in ambiguous situations, balance speed and accuracy, and adjust priorities proactively


RECRUITMENT STEPS

 - Recruiter screen

 - Hiring Manager interview

 - Peer programming session

 - System design interview

 - Final interviews with Engineering leadership" />

 real production systems, set the standards other teams build against, and see your work in front of hundreds of thousands of users in audit and finance.</p><p style=\"min-height:1.5em\"></p><h2>About DataSnipper</h2><p style=\"min-height:1.5em\">Audit and finance are still massively manual and we are changing that. DataSnipper is a $1B, bootstrapped unicorn with 600,000+ users across 180+ countries, already embedded in the daily workflows of top audit and accounting firms.<br />Now, we are taking things further with our Excel Agent, bringing AI directly into where the work actually happens. Unlike generic AI tools, we do not sit on the sidelines. Our AI operates inside Excel, with access to real documents and audit evidence, meaning it does not just generate answers, it does the work, with full traceability.<br />We are not just applying AI, we are redefining how audit gets done. If you want to build something category-defining at scale, this is the place.</p><p style=\"min-height:1.5em\"></p><h2>What you will do</h2><h3>Technical Delivery</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Own the LLM gateway: routing, provider failover, rate limits, retries, and cost attribution across multiple model providers</p></li><li><p style=\"min-height:1.5em\">Deploy, version and deprecate models across clouds, regions and environments, including quota and capacity planning, managed as infrastructure as code</p></li><li><p style=\"min-height:1.5em\">Build the shared evaluation platform: versioned datasets, experiment tracking, run and result schemas, reporting, and trace linkage back to the run</p></li><li><p style=\"min-height:1.5em\">Own the infrastructure for async and long-running AI workloads</p></li></ul><h3>Reliability, Security &amp; On-Call</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Own observability for AI traffic: latency, retries and fallbacks, token usage, cost and errors, per team and per use case</p></li><li><p style=\"min-height:1.5em\">Take part in the on-call rotation, run incidents, and close the follow-ups</p></li><li><p style=\"min-height:1.5em\">Implement the security and compliance controls the platform is held to: retention, access control, RBAC and SSO</p></li></ul><h3>Collaboration &amp; Impact</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Define and maintain clean integration contracts between the platform and the teams that consume it</p></li><li><p style=\"min-height:1.5em\">Partner with product and ML engineers to turn their requirements into platform capabilities that are self-service rather than a request queue</p></li></ul><p style=\"min-height:1.5em\"></p><h2>What you will bring</h2><h3>Must-Have</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">5+ years in backend or platform engineering, with strong production Python</p></li><li><p style=\"min-height:1.5em\">Experience building or running LLM inference infrastructure: a gateway or routing layer with multiple providers, failover, rate limiting and cost attribution</p></li><li><p style=\"min-height:1.5em\">Experience with cloud at the infrastructure level and infrastructure as code (<em>we run across Azure and GCP with Terraform</em>)</p></li><li><p style=\"min-height:1.5em\">Experience running a shared service in production: on-call, incidents, postmortems, SLOs</p></li><li><p style=\"min-height:1.5em\">Hands-on experience with observability tools (OpenTelemetry, Grafana), including instrumenting services and designing dashboards and alerts</p></li><li><p style=\"min-height:1.5em\">Comfort with privacy and compliance work: PII handling, anonymisation, retention, access control</p></li><li><p style=\"min-height:1.5em\">Experience building platform or shared-service capabilities consumed by multiple internal teams</p></li></ul><h3>Nice-to-Have</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with LLM or agent evaluation</p></li><li><p s
