    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Software Engineer, Agent Platform","description":"<p style=\"min-height:1.5em\"><strong>About Decagon</strong></p><p style=\"min-height:1.5em\">Decagon is the leading conversational AI platform empowering every brand to deliver concierge customer experiences.</p><p style=\"min-height:1.5em\">Our technology enables industry-defining enterprises like Avis Budget Group, Block’s Cash App and Square, Chime, Oura Health, and Hunter Douglas to deploy AI agents that power personalized, deeply satisfying interactions across voice, chat, email, SMS, and every other channel.</p><p style=\"min-height:1.5em\">We’re building a future where customer experiences are being redefined from support tickets and hold music to faster resolutions, richer conversations, and deeper relationships. We’re proud to be backed by world-class investors who share that vision, including a16z, Accel, Bain Capital Ventures, Coatue, and Index Ventures, along with many others.</p><p style=\"min-height:1.5em\">We’re an in-office company, driven by a shared commitment to excellence and velocity. Our values — Just Get It Done, Invent What Customers Want, Winner’s Mindset, and The Polymath Principle — shape how we work and grow as a team.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About the Team</strong></p><p style=\"min-height:1.5em\">The Agent Platform team builds the runtime and model orchestration layer that powers Decagon’s agents in production. This is the orchestration layer that turns workflows, tools and guardrails into a reliable, low-latency, and delightful experience for end users.</p><p style=\"min-height:1.5em\">At the core of this work is the agent harness: the routing, execution logic, tool orchestration, and control-plane systems that determine how an agent behaves in a live conversation. The team owns the full execution lifecycle of each conversation—from selecting workflows and orchestrating multiple models (e.g., router/planner/supervisor patterns), to coordinating tool calls, enforcing safety constraints, and communicating back to the user.</p><p style=\"min-height:1.5em\">The team operates across both real-time systems (e.g., voice interactions with strict latency requirements) and longer-horizon execution (supporting more complex reasoning and workflows). Our research shows that an agent’s task execution reliability increasingly depends on the orchestration layer that wraps around it.</p><p style=\"min-height:1.5em\">This is highly experimental, frontier-style engineering. The team continuously analyzes real-world failures, builds feedback loops through offline evaluation and online experimentation, and iterates quickly to improve quality, reliability, and capability. As model capabilities evolve, the team regularly rethinks system design to push agent performance forward in production.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><strong>About the Role</strong></p><p style=\"min-height:1.5em\">As a Senior Software Engineer on the Agent Platform team, you will design and build the systems that govern how Decagon agents operate in real-world environments.</p><p style=\"min-height:1.5em\">You will own complex, distributed systems that sit at the heart of the agent runtime: execution frameworks, model orchestration logic, and experimentation platforms that ensure agents are fast, reliable, and continuously improving. Your work will directly impact how agents reason, take actions, and deliver outcomes across millions of interactions.</p><p style=\"min-height:1.5em\">This role operates in a fast-moving, ambiguous space with tight feedback loops. You’ll move fluidly between diagnosing production issues, designing new system abstractions, and running experiments to improve agent behavior. You’ll collaborate closely with Research, Infra, and Product teams to ship improvements safely and at scale.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><strong>In this role, you will</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and evolve agent harnesses that power different product experiences</p></li><li><p style=\"min-height:1.5em\">Build core runtime systems, including AOP execution and multi-model orchestration</p></li><li><p style=\"min-height:1.5em\">Develop control-plane logic for routing, planning, and tool invocation with strong safety guarantees</p></li><li><p style=\"min-height:1.5em\">Optimize agent systems for latency, reliability, and production correctness</p></li><li><p style=\"min-height:1.5em\">Analyze real-world failures and use data to drive iterative improvements</p></li><li><p style=\"min-height:1.5em\">Build and operate online experimentation (A/B testing) and contribute to offline evaluation frameworks</p></li><li><p style=\"min-height:1.5em\">Improve observability, testing, and simulation systems to ensure safe, measurable progress</p></li><li><p style=\"min-height:1.5em\">Contribute to voice and real-time systems (e.g., transcription pipelines, turn-taking, latency improvements)</p></li><li><p style=\"min-height:1.5em\">Continuously adapt orchestration systems as model capabilities evolve</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><strong>Your background looks something like this</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong experience building distributed systems or backend platforms in production environments</p></li><li><p style=\"min-height:1.5em\">Comfort working in ambiguous, fast-moving environments with rapid iteration cycles</p></li><li><p style=\"min-height:1.5em\">Experience owning systems end-to-end, from design through production and iteration</p></li><li><p style=\"min-height:1.5em\">Familiarity with experimentation, evaluation, or data-driven product improvement loops</p></li><li><p style=\"min-height:1.5em\">A track record of improving system reliability, performance, and observability</p></li><li><p style=\"min-height:1.5em\">Ability to debug complex systems and identify root causes of failures</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><strong>Even better</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ve built or worked on agent harnesses, orchestration layers, or execution frameworks</p></li><li><p style=\"min-height:1.5em\">You think in terms of control planes, feedback loops, and system-level optimization, not just features</p></li><li><p style=\"min-height:1.5em\">You’re excited about diagnosing failure modes and iterating toward measurable improvements</p></li><li><p style=\"min-height:1.5em\">You care deeply about production quality—not just making systems work, but making them reliable, safe, and scalable</p></li><li><p style=\"min-height:1.5em\">You’re motivated by pushing the frontier of how intelligent systems behave in the real world</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div></li></ul><p style=\"min-height:1.5em\"><strong>Compensation</strong></p><p style=\"min-height:1.5em\">$200K – $400K + Offers Equity</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">This range reflects the expected compensation for this role. Compensation within the range is determined based on experience, skills, and the scope of responsibilities, with flexibility for candidates who demonstrate exceptional impact.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\">In addition to base salary, we offer competitive equity. Final compensation may vary based on location within the United States.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Benefits</strong></p><p style=\"min-height:1.5em\">We proudly offer the following benefits for our full-time employees:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Medical, Dental, and Vision benefits for you and your family</p></li><li><p style=\"min-height:1.5em\">Life Insurance and Disability Benefits</p></li><li><p style=\"min-height:1.5em\">Retirement Plan (e.g., 401K, pension)</p></li><li><p style=\"min-height:1.5em\">Parental Leave</p></li><li><p style=\"min-height:1.5em\">Fertility and family building benefits through Carrot</p></li><li><p style=\"min-height:1.5em\">Monthly stipend to support your wellness, lifestyle, and work-life balance</p></li><li><p style=\"min-height:1.5em\">Daily lunches and snacks in the office to keep you at your best</p></li><li><p style=\"min-height:1.5em\">Take what you need vacation policy (subject to local requirements; UK employees receive 25 days of statutory leave)</p></li></ul><p style=\"min-height:1.5em\"><em>These benefits are described in more detail in Decagon’s policies, may vary by location, and can change at any time according to applicable compensation and benefits plans.</em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Decagon","value":"75f544ae-7838-4ffa-9e6b-33d7e2b6ea2b"},"datePosted":"2025-11-19","hiringOrganization":{"@type":"Organization","name":"Decagon","sameAs":"https://decagon.ai/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/c9d1b6ec-be84-4801-bf17-4fe1422349e6/185d14f2-d29e-4562-98ef-d44a32883376/ed11392e-a580-48f2-9720-bbca7a9df696.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"CA","addressCountry":"United States"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":200000,"maxValue":400000,"unitText":"YEAR"}}}</script>
