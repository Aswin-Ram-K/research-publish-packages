    <meta name="description" property="og:description" content="The National Laboratory of the Rockies (NLR) is the U.S. Department of Energy&#39;s primary national laboratory for critical minerals, energy innovation, and energy security. With locations in Golden and Boulder, Colorado, Fairbanks, Alaska, and a satellite office in Washington, D.C., NLR bridges foundational research with practical applications to develop and bring to scale new energy materials and technologies that lower energy costs, drive economic growth, and deliver abundant and reliable energy. NLR is subject to Department of Energy (DOE) access restrictions. All candidates must be authorized to access the facility per DOE rules and guidance within a reasonable time frame for the specified position in order to be considered for an interview and for hiring. DOE rules for site access during the interview process depend on whether the candidate is interviewed on-site, off-site, or via telephone or videoconference. All employees must also be able to obtain and maintain a federal Personal Identity Verification (PIV) card as required by Homeland Security Presidential Directive 12 (HSPD-12), which includes a favorable background investigation. Additionally, DOE contractor employees are prohibited from participating in certain Foreign Government Talent Recruitment Programs (FGTRPs). If a candidate is currently participating in an FGTRP, they will be required to disclose their participation after receiving an offer of employment and may be required to disengage from participation in the FGTRP prior to commencing employment. Any offer of employment is conditional on the ability to obtain work authorization and to be granted access to NLR by the Department of Energy (DOE). Drug Free Workplace NLR is committed to maintaining a drug-free workplace in accordance with federal Drug-Free Workplace Act and complies with federal laws prohibiting the possession and use of illegal drugs. Under federal law, marijuana remains an illegal drug. If you are offered employment at NLR, you must pass a pre-employment drug test prior to commencing employment. Unless prohibited by state or local law, the pre-employment drug test will include marijuana. If you test positive on the pre-employment drug test, your offer of employment may be withdrawn. Please review the information on our Hiring Process website before you create an account and apply for a job. We also hope you will learn more about NLR, visit our Careers site, and continue to search for job opportunities at the lab.">
