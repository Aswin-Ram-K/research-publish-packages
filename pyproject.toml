[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resextract"
version = "0.1.0"
description = "Bounded research extractor over graphify graphs"
requires-python = ">=3.14"
dependencies = [
    "graphifyy[openai,pdf,office,leiden,watch]==0.9.80",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "httpx",
    "jinja2",
    "pydantic",
    "pyyaml",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
resextract = "resextract.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["resextract"]

[tool.setuptools.package-data]
resextract = ["py.typed"]
