    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Technical Product Manager — Agent Runtime","description":"<p style=\"min-height:1.5em\">We're looking for a Technical PM to own the <strong>agent runtime and the platform that powers our agentic products</strong> — and the non-functional requirements that make those agents accurate, fast, reliable, and cost-effective at scale.</p><p style=\"min-height:1.5em\">You'll own <em>how well the platform runs</em>, not the end-user features on top of it. You'll define the runtime architecture, own the product evals that prove our agents stay accurate as we scale and upgrade models, and set the bar for latency, reliability, cost, and observability across our agent runtimes.</p><p style=\"min-height:1.5em\">This is an engineering-facing role — but it's a product role at heart. You translate what customers and the business actually need into the architecture that delivers it: <strong>product judgment expressed through technical decisions.</strong> You'll spend your time in architecture discussions and eval design alongside ML and backend engineers, not in design reviews. When you work with go-to-market, it's to turn runtime scale, stability, and reliability into a story the market trusts. And you'll track how the frontier of agentic engineering is moving — keeping us ahead of it and being a visible voice on it inside and outside the company.</p><p style=\"min-height:1.5em\">If you've never written a prompt chain, debugged a pipeline, reasoned about token cost, or designed an eval, this isn't the right fit.</p><p style=\"min-height:1.5em\"></p><h2>About DataSnipper </h2><p style=\"min-height:1.5em\">Audit and finance are still massively manual and we are changing that. DataSnipper is a $1B, bootstrapped unicorn with 600,000+ users across 180+ countries, already embedded in the daily workflows of top audit and accounting firms.</p><p style=\"min-height:1.5em\">Now, we are taking things further with our Excel Agent, bringing AI directly into where the work actually happens. Unlike generic AI tools, we do not sit on the sidelines. Our AI operates inside Excel, with access to real documents and audit evidence, meaning it does not just generate answers, it does the work, with full traceability.</p><p style=\"min-height:1.5em\">We are not just applying AI, we are redefining how audit gets done. If you want to build something category-defining at scale, this is the place.</p><p style=\"min-height:1.5em\"></p><h2>What you'll own</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Agent runtime architecture.</strong> Technical direction for our agent runtimes: agent orchestration and multi-step loops, context and memory management, retrieval strategy, tool execution and orchestration, model routing and fallbacks, guardrails, caching, streaming, and concurrency.</p></li><li><p style=\"min-height:1.5em\"><strong>Non-functional requirements of the platform.</strong> <em>How well the platform runs</em> - latency, throughput, reliability, graceful degradation, scalability under concurrent agent load, token-cost economics, security, and observability/telemetry. These are your primary success metrics, not feature counts.</p></li><li><p style=\"min-height:1.5em\"><strong>Product evals.</strong> Own the creation and running of the evals that prove our agents are accurate and reliable - defining the quality bar every agent meets before it ships, and the measures that let us improve and upgrade models with confidence. You work hand in hand with our LLM Ops team, who own the eval infrastructure; you own the evals themselves and what they tell us.</p></li><li><p style=\"min-height:1.5em\"><strong> Model strategy.</strong> Model selection, swaps, and provider decisions; cost/performance trade-offs; staying current as frontier models move.</p></li><li><p style=\"min-height:1.5em\"><strong>Market intelligence &amp; thought leadership.</strong> Track how the field is building agentic systems. Own a point of view on what differentiates us and where the runtime must go to stay ahead - and evangelize it both internally and externally (talks, writing, customer and industry conversations).</p></li><li><p style=\"min-height:1.5em\"><strong>Cross-functional partnership.</strong> Engineering is your primary partner - you operate as a technical peer to engineering managers and tech leads, not just a prioritization partner. You translate experience-team needs into runtime capability, and partner with go-to-market on scale, stability, and reliability.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Who you are</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>A tinkerer.</strong> You build to understand - prototypes, prompt chains, quick experiments. You'd rather try it than theorize about it.</p></li><li><p style=\"min-height:1.5em\"><strong>A product thinker in an engineer's seat.</strong> You don't need to be an auditor, but you love representing the customer and the business problem - and turning that understanding into strong architecture. The technical depth is in service of product value, not an end in itself.</p></li><li><p style=\"min-height:1.5em\"><strong>Highly autonomous.</strong> You operate with little direction: you find the problems that matter, set the direction, and drive them without waiting to be told.</p></li><li><p style=\"min-height:1.5em\"><strong>Entrepreneurial.</strong> You treat your area like your own company -  scrappy, outcome-obsessed, and comfortable making the call under ambiguity.</p><p style=\"min-height:1.5em\"></p></li></ul><h2>What you'll bring</h2><p style=\"min-height:1.5em\"><strong>Must-have:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">4+ years in product management, with 2+ years on technical/platform products (APIs, infrastructure, ML systems, or developer tools)</p></li><li><p style=\"min-height:1.5em\">Deep understanding of LLM-based systems and agent architectures: prompting, tool use, planning, multi-step agent loops, context and memory, multi-agent systems - with enough grasp of retrieval/vector search to judge when it's the right tool</p></li><li><p style=\"min-height:1.5em\">Background in distributed systems or infrastructure - you understand how runtimes behave under scale and how a change ripples across the stack</p></li><li><p style=\"min-height:1.5em\">Treats non-functional requirements as a first-class product surface: latency, reliability, scalability, cost, observability</p></li><li><p style=\"min-height:1.5em\">Hands-on experience creating and running evals that measure and improve agent accuracy and reliability at scale</p></li><li><p style=\"min-height:1.5em\">Fluency in model operations: model selection and swaps, provider trade-offs, token cost/performance optimization</p></li><li><p style=\"min-height:1.5em\">Can write technical specs that engineers review for feasibility (not correctness) and prototype with code to validate hypotheses; comfortable with architecture trade-offs (latency vs. accuracy, cost vs. capability)</p></li></ul><p style=\"min-height:1.5em\"><strong>Strong-to-have:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Former software engineer, ML engineer, or data scientist who moved into product</p></li><li><p style=\"min-height:1.5em\">A public point of view on AI/agents - writing, talks, OSS - or the appetite to build one</p></li><li><p style=\"min-height:1.5em\">Experience in audit, accounting, or financial services (domain context for what the agents do)</p></li></ul><p style=\"min-height:1.5em\"></p><h2>What We Offer </h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Be part of one of the fastest-growing, profitable unicorn scale-ups in the Netherlands with a global impact.</p></li><li><p style=\"min-height:1.5em\">Equity (Stock Appreciation Rights) to share in the company’s success and growth.</p></li><li><p style=\"min-height:1.5em\">Pension plan with a 6% contribution on top of your base salary.</p></li><li><p style=\"min-height:1.5em\">28 vacation days per year (full-time) to support your work-life balance.</p></li><li><p style=\"min-height:1.5em\">Hybrid work model with at least 3 days onsite in our dynamic Amsterdam office.</p></li><li><p style=\"min-height:1.5em\">Daily, freshly prepared lunches by our in-house chef to keep you energised.</p></li><li><p style=\"min-height:1.5em\">NS business card for easy commuting to the office.</p></li><li><p style=\"min-height:1.5em\">A structured onboarding programme designed to set you up for success, including dedicated time to learn our product and customers before you hit the ground running.</p></li><li><p style=\"min-height:1.5em\">Access to continuous learning and development initiatives to grow your skills.</p></li><li><p style=\"min-height:1.5em\">Engage with a vibrant international team spread across seven global offices.</p></li><li><p style=\"min-height:1.5em\">Company-wide events like DataSnipper GO, where global teams come together.</p></li><li><p style=\"min-height:1.5em\">Access to OpenUp, a mental health and wellness platform supporting your wellbeing.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Recruitment steps</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Recruiter screen</p></li><li><p style=\"min-height:1.5em\">Hiring Manager interview</p></li><li><p style=\"min-height:1.5em\">Assessment interview</p></li><li><p style=\"min-height:1.5em\">Final interview with Engineering leadership</p></li></ul><p style=\"min-height:1.5em\"></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"DataSnipper","value":"ea4bb202-d0c8-40e2-868d-0ee6f5b80f65"},"datePosted":"2026-07-12","hiringOrganization":{"@type":"Organization","name":"DataSnipper","sameAs":"https://careers.datasnipper.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/f45f8e16-a29c-480b-b489-03b933e3751c/6f991d62-8f2f-4eb6-9607-54134b7475bb/18c074b0-d750-4d93-9021-cbe5fbaa5214.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Amsterdam","addressRegion":"Noord-Holland","addressCountry":"The Netherlands"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"The Netherlands"}}</script>
