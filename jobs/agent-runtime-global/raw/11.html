    <title>Agent Harness Engineer @ Viktor</title><meta name="title" content="Agent Harness Engineer @ Viktor" />
    
  
  <meta name="description" content="THE SHORT VERSION

You&#39;re the person who makes Viktor do more things, for more customers, more reliably. You&#39;ve built agents before (runtime, tools, memory, evals) and have opinions about what makes them work. You ship the day you write the code and reach for agentic engineering by default. If you&#39;ve never built an agent, this isn&#39;t the role.

 


THE HARD PART

We&#39;re building a harness ready for AGI. Models keep getting better on their own; the harness decides how much of that intelligence turns into real work. Viktor shouldn&#39;t wait to be handed tasks. It should explore what a company is doing and automate it on its own.

Getting there is context engineering at the frontier: how the system prompt, skills, memory, and tools interact on diverse, complex problems, and how that interplay holds up across the real work of 56,000+ workspaces.

 


WHAT YOU&#39;LL ACTUALLY DO

 - Build the agent runtime: the loop where it plans, acts, and verifies its own work instead of declaring success it didn&#39;t earn.

 - Engineer the context: shape how the system prompt, skills, memory, and tools combine, and how the agent holds up when problems get diverse and complex.

 - Make the agent fluent with tools: composition across many integrations, recall, and the skill files that keep the right functions at hand.

 - Grow what the agent can do: memory it can trust, skills it writes for itself, work it runs on its own.

 - Make it measurably better: evals, catching regressions, and turning every failure into a fix.

 - Ship product: features that reach users through Slack and Teams within hours.

 - Whatever needs building. Small team, large surface.

 


WHO YOU ARE

 - You&#39;ve personally built or significantly modified an AI agent harness, and can describe the trade-offs you made.

 - You understand how an agent&#39;s system prompt, skills, and tools interact on diverse and complex problems, and you&#39;ve tuned that interplay yourself, not just read about it.

 - You&#39;ve built custom skills, commands, CLIs, or MCP servers to make your own agentic coding faster.

 - Agentic coding is your daily workflow, and you&#39;ve stress-tested models and harnesses across the frontier.

 - Systems thinking. You make hard technical trade-offs and design for how things break at scale.

 - Speed, with the bar up. You ship today, not Thursday.

 - Genuine interest in how AI works. You&#39;ve read the papers and have opinions about evals.

 - Munich or Warsaw, or remote in Europe.

 


WHY THIS ROLE IS DIFFERENT

 - No layers. You work directly with both founders, and decisions get made in the room, not in a Linear ticket.

 - The agent is the product. Every reliability win shows up in retention the next week.

 - Frontier work. You&#39;re building a harness at the edge of what&#39;s currently possible, experimenting with agents that can take on full responsibilities, not just tasks.

 


EVEN BETTER IF

 - Previous AI engineering experience: agents, harnesses, eval infrastructure.

 - Previous founder or early-stage builder.

 - Open source contributions to the AI tooling we live in.

 


TECH

Python. No agent framework, no orchestration library. We build the harness ourselves, from the loop up.

 


HOW WE WORK

Small team, high trust, low process. Decisions are made by owners, not committees. You will ship your first week. You will talk to users your first day.

We don&#39;t do alignment meetings or stakeholder syncs. We build things, see if they work, and iterate.

 


WHY VIKTOR

Singular focus: we&#39;re building a harness that can hold an AGI-level model and make it useful for everyone.

We&#39;re one of the fastest-growing companies in the world. The product works. The market is pulling.

This is a rare window: everyone here owns something real. Not a task. A surface of the company that customers depend on. That doesn&#39;t last forever. Right now, it&#39;s still true.

 


COMPENSATION

Top-of-the-market salary and the kind of ownership that only exists at this stage.

The best work happens when you&#39;re in the room. This role is Munich or Warsaw, or remote in Europe, and we bring the whole team together in person a few times a year." />

r.com/careers\">Meet the team here</a>. ✌️</p>","jobBoardBottomDescriptionHtml":"<p style=\"min-height:1.5em\">Nothing above fit? Tell us what you'd build if you joined. <strong>careers@viktor.com</strong></p><p style=\"min-height:1.5em\">We hire for taste and intensity, not just open headcount. Some of the best people on this team applied for roles that didn't exist yet.</p>","jobPostingBackUrl":null,"__typename":"Theme"},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":null,"activeFeatureFlags":["AiNotetakerCandidateConsentPolicies","ApplicationForReferrals","ApprovalNotesFromEmail","BookingLinkRescheduleLimits","CanonicalizeSchools","CoreMultipleBrands","CoreMultipleBrandsFeedFiltering","CoreMultipleBrandsLinkedInJobWrappingStreamingFix","DemoOrgBanners","EducationHistoryFormField","ExplicitAutomatedProcessingOptOutConfirmation","JobBoardCookieConsentControls","JobBoardEtagValidation","JobPostingApplicationDeadlines","JobPostingListV2","JobPostingWorkplaceTypeOverrideSecondaryLocationsToo","LinkedInIntegrationRequireCompanyId","LinkedInTOSUpdate","LocationExternalName","MigrateGoogleRecaptchaAutomatedLegal","RejectBase64EncodedResumesFrontEnd","RejectBase64EncodedResumesThrowErrorFrontEnd","RejectInvalidFileTypeOnUpload","RejectUrlsInCandidateName","SchedulingCandidateAvailabilityNote","SchedulingDirectBookingLogDirectBookingEventsJson","SchedulingGCalSendUpdatesForCancelEvents","SchedulingRescheduleAndCancellationReasonsNonUser","SchedulingUseLocaleInTimeFormatting","ShowCountsOnJobBoardFilterOptions","SocialSharingHtmlMetaSettings","UseGlobalQueryScopesOnGlobalApplicationQuestions","UseGoogleRecaptchaUniversalKey","UseJobPostingFiltersOnGlobalApplicationQuestions","UseJobPostingFiltersOnGlobalApplicationQuestionsUI","UseJobPostingFiltersOnSurveys","UseJobPostingFiltersOnSurveysUI","ValidateFileTypeOnUpload"],"timezone":"Europe/Warsaw","candidateScheduleCancellationReasonRequirementStatus":"Optional","showCookieBanner":false,"__typename":"Organization"},"posting":{"id":"d5d2d0fa-e10d-42f9-a2fb-384274b4f3e8","title":"Agent Harness Engineer","departmentName":"Product & Engineering","departmentExternalName":"Product & Engineering","locationName":"Warsaw or Munich onsite","locationAddress":null,"workplaceType":null,"employmentType":"FullTime","descriptionHtml":"<h2><strong>The Short Version</strong></h2><p style=\"min-height:1.5em\">You're the person who makes Viktor do more things, for more customers, more reliably. You've built agents before (runtime, tools, memory, evals) and have opinions about what makes them work. You ship the day you write the code and reach for agentic engineering by default. If you've never built an agent, this isn't the role.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>The Hard Part</strong></h2><p style=\"min-height:1.5em\">We're building a harness ready for AGI. Models keep getting better on their own; the harness decides how much of that intelligence turns into real work. Viktor shouldn't wait to be handed tasks. It should explore what a company is doing and automate it on its own.</p><p style=\"min-height:1.5em\">Getting there is context engineering at the frontier: how the system prompt, skills, memory, and tools interact on diverse, complex problems, and how that interplay holds up across the real work of 56,000+ workspaces.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>What You'll Actually Do</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build the agent runtime: the loop where it plans, acts, and verifies its own work instead of declaring success it didn't earn.</p></li><li><p style=\"min-height:1.5em\">Engineer the context: shape how the system prompt, skills, memory, and tools combine, and how the agent holds up when problems get diverse and complex.</p></li><li><p style=\"min-height:1.5em\">Make the agent fluent with tools: composition across many integrations, recall, and the skill files that keep the right functions at hand.</p></li><li><p style=\"min-height:1.5em\">Grow what the agent can do: memory it can trust, skills it writes for itself, work it runs on its own.</p></li><li><p style=\"min-height:1.5em\">Make it measurably better: evals, catching regressions, and turning every failure into a fix.</p></li><li><p style=\"min-height:1.5em\">Ship product: features that reach users through Slack and Teams within hours.</p></li><li><p style=\"min-height:1.5em\">Whatever needs building. Small team, large surface.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Who You Are</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You've personally built or significantly modified an AI agent harness, and can describe the trade-offs you made.</p></li><li><p style=\"min-height:1.5em\">You understand how an agent's system prompt, skills, and tools interact on diverse and complex problems, and you've tuned that interplay yourself, not just read about it.</p></li><li><p style=\"min-height:1.5em\">You've built custom skills, commands, CLIs, or MCP servers to make your own agentic coding faster.</p></li><li><p style=\"min-height:1.5em\">Agentic coding is your daily workflow, and you've stress-tested models and harnesses across the frontier.</p></li><li><p style=\"min-height:1.5em\">Systems thinking. You make hard technical trade-offs and design for how things break at scale.</p></li><li><p style=\"min-height:1.5em\">Speed, with the bar up. You ship today, not Thursday.</p></li><li><p style=\"min-height:1.5em\">Genuine interest in how AI works. You've read the papers and have opinions about evals.</p></li><li><p style=\"min-height:1.5em\">Munich or Warsaw, or remote in Europe.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Why This Role Is Different</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">No layers. You work directly with both founders, and decisions get made in the room, not in a Linear ticket.</p></li><li><p style=\"min-height:1.5em\">The agent is the product. Every reliability win shows up in retention the next week.</p></li><li><p style=\"min-height:1.5em\">Frontier work. You're building a harness at the edge of what's currently possible, experimenting with agents that can take on full responsibilities, not just tasks.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Even Better If</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Previous AI engineering experience: agents, harnesses, eval infrastructure.</p></li><li><p style=\"min-height:1.5em\">Previous founder or early-stage builder.</p></li><li><p style=\"min-height:1.5em\">Open source contributions to the AI tooling we live in.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Tech</strong></h2><p style=\"min-height:1.5em\">Python. No agent framework, no orchestration library. We build the harness ourselves, from the loop up.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>How we work</strong></h2><p style=\"min-height:1.5em\">Small team, high trust, low process. Decisions are made by owners, not committees. You will ship your first week. You will talk to users your first day.</p><p style=\"min-height:1.5em\">We don't do alignment meetings or stakeholder syncs. We build things, see if they work, and iterate.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Why Viktor</strong></h2><p style=\"min-height:1.5em\">Singular focus: we're building a harness that can hold an AGI-level model and make it useful for everyone.</p><p style=\"min-height:1.5em\">We're one of the fastest-growing companies in the world. The product works. The market is pulling.</p><p style=\"min-height:1.5em\">This is a rare window: everyone here owns something real. Not a task. A surface of the company that customers depend on. That doesn't last forever. Right now, it's still true.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Compensation</strong></h2><p style=\"min-height:1.5em\">Top-of-the-market salary and the kind of ownership that only exists at this stage.</p><p style=\"min-height:1.5em\">The best work happens when you're in the room. This role is Munich or Warsaw, or remote in Europe, and we bring the whole team together in person a few times a year.</p>","isListed":true,"isConfidential":false,"teamNames":["Product & Engineering"],"secondaryLocationNames":["remote in Europe"],"compensationTierSummary":null,"compensationTiers":[],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":null,"compensationPhilosophyHtml":null,"applicationLimitCalloutHtml":null,"shouldAskForTextingConsent":false,"shouldAskForWhatsAppConsent":false,"candidateTextingPrivacyPolicyUrl":null,"candidateTextingTermsAndConditionsUrl":null,"legalEntityNameForTextingConsent":"Viktor","automatedProcessingLegalNotice":null,"__typename":"JobPostingDetails"},"jobBoard":null,"routerPrefix":"/","recaptchaPublicSiteKey":"6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y","recaptchaUniversalPublicSiteKey":"6LezdY0tAAAAAEnollNLCAI0z1VDGwM7AzGrU4XZ"};
