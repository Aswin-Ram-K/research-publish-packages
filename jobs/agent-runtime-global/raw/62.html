    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Research Engineer, Evals","description":"<h2>Role</h2><p style=\"min-height:1.5em\">At Variance, we are teaching machines to make the hardest judgment calls at scale. That means building AI agents for the high-stakes gray area of risk investigations, fraud, and identity reviews.</p><p style=\"min-height:1.5em\">We’re a small, talent-dense team in San Francisco working on a problem at the edge of what AI systems can reliably do: making good decisions in messy, adversarial, real-world environments. We focus on building, high-consequence systems problems where the edge cases matter most.</p><p style=\"min-height:1.5em\">We’re looking for a <strong>Research Engineer</strong> to help define how we measure and improve model quality. You’ll build the benchmarks, datasets, tooling, and evaluation loops that tell us whether our systems are actually getting better on the tasks that matter. This role sits at the center of research, product, and engineering. It is about creating rigorous, domain-specific evaluations that reflect real customer workflows, expose meaningful failure modes, and drive the next generation of model and agent improvements.</p><p style=\"min-height:1.5em\"></p><h2>You’re a fit if you:</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Care deeply about craftsmanship and have strong opinions about model quality, measurement, and experimental rigor</p></li><li><p style=\"min-height:1.5em\">Want to work on core model and agent behavior, not just surface-level product metrics</p></li><li><p style=\"min-height:1.5em\">Are excited by the challenge of defining what “good” looks like in messy, high-stakes environments</p></li><li><p style=\"min-height:1.5em\">Think in tight loops: hypothesis, benchmark design, evaluation, failure analysis, iteration</p></li><li><p style=\"min-height:1.5em\">Have strong engineering fundamentals and like building robust systems around ambiguous research problems</p></li><li><p style=\"min-height:1.5em\">Thrive in environments where success criteria are initially underspecified and need to be sharpened through work</p></li><li><p style=\"min-height:1.5em\">Are willing to do the work in the trenches: reviewing outputs, grading edge cases, curating datasets, and refining tasks until the evaluation actually measures what matters</p></li><li><p style=\"min-height:1.5em\">Care deeply about building systems that protect people from fraud, scams, and abuse</p></li></ul><h2>What you’ll do</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build proprietary benchmarks and datasets to evaluate models and model systems on fraud, identity, and risk workflows</p></li><li><p style=\"min-height:1.5em\">Design and run offline and online evals that measure model performance on real customer tasks, not just abstract benchmarks</p></li><li><p style=\"min-height:1.5em\">Define quality metrics for judgment systems, including precision, calibration, consistency, abstention, and failure handling</p></li><li><p style=\"min-height:1.5em\">Study where models and agents break, and turn those failures into better evals, better datasets, and better training loops</p></li><li><p style=\"min-height:1.5em\">Build reusable evaluation tools and quality building blocks that can be used across different product surfaces and workflows</p></li><li><p style=\"min-height:1.5em\">Partner closely with research, engineering, product, and design to improve system quality through rigorous experimentation</p></li><li><p style=\"min-height:1.5em\">Help create a strong culture of scientific experimentation, clear measurement, and continuous iteration</p></li><li><p style=\"min-height:1.5em\">Push the boundary of how AI systems are evaluated in regulated, adversarial, and high-consequence environments</p></li></ul><h2>What success looks like</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We have a clear, trusted view of how our systems perform across the workflows that matter most</p></li><li><p style=\"min-height:1.5em\">Our evals predict real-world quality better than generic benchmarks</p></li><li><p style=\"min-height:1.5em\">We identify meaningful failure modes earlier and improve system behavior faster</p></li><li><p style=\"min-height:1.5em\">We develop differentiated datasets, benchmarks, and quality loops that compound over time</p></li><li><p style=\"min-height:1.5em\">Research and engineering teams use your work to make better decisions about what to train, ship, and improve next</p></li><li><p style=\"min-height:1.5em\">Variance becomes known for rigorous, domain-specific evaluation of judgment systems</p></li></ul><h2>Preferred background</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience training, evaluating, or improving modern ML systems</p></li><li><p style=\"min-height:1.5em\">Strong programming skills and comfort working in research-heavy codebases</p></li><li><p style=\"min-height:1.5em\">Experience building benchmarks, datasets, evaluation pipelines, or quality systems</p></li><li><p style=\"min-height:1.5em\">Familiarity with LLMs, agent systems, retrieval, post-training, or adjacent areas</p></li><li><p style=\"min-height:1.5em\">Ability to design clean experiments and draw reliable conclusions from noisy results</p></li><li><p style=\"min-height:1.5em\">Strong engineering judgment and a bias toward building</p></li><li><p style=\"min-height:1.5em\">Interest in fraud, risk, trust and safety, compliance, or other regulated and adversarial domains</p></li></ul><h2>Our culture</h2><p style=\"min-height:1.5em\">We believe in ownership, urgency, and craft. We enjoy spirited debate, wild ideas, and building things we’re proud of. We’re fully in-person in San Francisco.</p><h2>What we offer</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive salary and meaningful equity</p></li><li><p style=\"min-height:1.5em\">Platinum-level medical, dental, and vision insurance</p></li><li><p style=\"min-height:1.5em\">Unlimited PTO, sick leave, and parental leave</p></li><li><p style=\"min-height:1.5em\">Up to $100 per month in reimbursement for personal health and wellness expenses</p></li><li><p style=\"min-height:1.5em\">401(k) plan</p></li></ul><p style=\"min-height:1.5em\"></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Variance","value":"66dfd37e-6df5-4f89-8454-b3005bd6e1aa"},"datePosted":"2026-03-31","hiringOrganization":{"@type":"Organization","name":"Variance","sameAs":"https://variance.co","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/9d302a47-4ad7-40cb-8bda-8d1e84b738eb/5998251a-ff3f-476b-a209-8966ab39f3fa/c38e73d3-fd9d-4616-9d27-6e16ebffcb5d.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"USA"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":180000,"maxValue":300000,"unitText":"YEAR"}}}</script>
