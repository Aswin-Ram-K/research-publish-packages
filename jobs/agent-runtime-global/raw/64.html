    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Research Engineer (Evals)","description":"<p style=\"min-height:1.5em\"><strong>TL;DR:</strong> We're looking for a research engineer to build and maintain our internal suite of benchmarks, covering single/multi-turn content and agentic guardrails. The research engineer would also work with the team on projects studying agent behaviours in the wild.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About us</strong></p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://whitecircle.ai/\">White Circle</a> is an AI Safety company building the safety, reliability, and optimization layer for AI systems. At the core of our platform are policies – simple natural-language rules that define what an AI model should and shouldn’t do. We automatically test, enforce, and continuously improve these policies at scale.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We’ve recently raised our Series A funding round, taking our total funding to $70M. Our investors include top funds, founders, and senior leaders at OpenAI, Anthropic, HuggingFace, Mistral, DeepMind, Datadog, Sentry, and others</p></li><li><p style=\"min-height:1.5em\">We process over 100M+ API calls every month</p></li><li><p style=\"min-height:1.5em\">We fine-tune and train our own LLMs so they run faster and cheaper than any open or proprietary model</p></li></ul><p style=\"min-height:1.5em\">We’re a small, highly focused team. If you want to work deeply on hard problems, see your work ship to production quickly, and influence how AI safety is actually built – you’re the one we need.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About the team</strong></p><p style=\"min-height:1.5em\">White Circle's fundamental research team works on the science of how AI systems fail in the real world: where agents break, how misalignment actually looks like to the end user, and how it is present in the model internals. We build the evals, benchmarks, environments, and tooling that empirically study high-impact agent reliability concerns — some of which become the guardrails shipped in our products, and some of which become public writeups.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What you’ll do</strong></p><p style=\"min-height:1.5em\">Own and maintain our internal benchmark suite, covering single/multi-turn content guardrails and agentic safety.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build benchmarks that distinguish specific model capabilities.</p></li><li><p style=\"min-height:1.5em\">Work with the product team to build evals covering core functionality of our flagship models.</p></li><li><p style=\"min-height:1.5em\">Build benchmarks for new features coming out of the research team.</p></li><li><p style=\"min-height:1.5em\">Adapt and extend evals to new verticals and changing product data.</p></li><li><p style=\"min-height:1.5em\">Work on research projects that study and quantify realistic agentic and LLM failure modes in the wild.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>You’ll fit right in if you</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Have built an LLM benchmark from scratch that distinguished specific model capabilities (i.e., produced a measurable, defensible capability difference, not just a score).</p></li><li><p style=\"min-height:1.5em\">Have built synthetic data for post-training textual or multimodal models.</p></li><li><p style=\"min-height:1.5em\">Can reproduce a published benchmark result and identify where the original methodology is fragile or misleading.</p></li><li><p style=\"min-height:1.5em\">You write Python that other people can build on. Our whole stack is Python; we want someone who has shipped and maintained production code and who factors messy problems into clean abstractions others can extend.</p></li><li><p style=\"min-height:1.5em\">You can write efficient LLM inference setups, including sensible orchestration of parallel calls, retries, rate-limit handling.</p></li><li><p style=\"min-height:1.5em\">An AI power-user — fluent with frontier models and coding agents day to day.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\"><strong>A big plus</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Automated red-teaming experience</p></li><li><p style=\"min-height:1.5em\">Have worked across a range of agentic scaffolds and reproduced public benchmark results on them</p></li><li><p style=\"min-height:1.5em\">Strong knowledge of existing reward-model / monitoring / safety benchmarks</p></li><li><p style=\"min-height:1.5em\">One or more published papers in the evals / safety-evaluation space</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Compensation &amp; benefits</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive compensation, including equity</p></li><li><p style=\"min-height:1.5em\">Flexible time off</p></li><li><p style=\"min-height:1.5em\">Office in central London/Paris with flexible hybrid setup</p></li><li><p style=\"min-height:1.5em\">Relocation support if you’re moving to Paris, available after your probationary period</p></li><li><p style=\"min-height:1.5em\">Premium private health insurance</p></li><li><p style=\"min-height:1.5em\">Mental health support, including coverage for therapy when you need it</p></li><li><p style=\"min-height:1.5em\">Lunch and dinner covered when you work from the office</p></li><li><p style=\"min-height:1.5em\">Learning and development support for courses, conferences, and opportunities to grow your skills</p></li><li><p style=\"min-height:1.5em\">All the hardware, subscriptions, tools, and services you need</p></li><li><p style=\"min-height:1.5em\">Team off-sites twice a year: we’ve recently been to the Alps, Saint-Tropez, and Marbella</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Process</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Intro call with Talent</p></li><li><p style=\"min-height:1.5em\">Test assignment </p></li><li><p style=\"min-height:1.5em\">Technical interview with Head of Fundamental Research</p></li><li><p style=\"min-height:1.5em\">Final interview with CEO</p></li></ol>","directApply":false,"identifier":{"@type":"PropertyValue","name":"White Circle","value":"07d24ec8-117f-4849-8dd5-2c2bc2cfbb40"},"datePosted":"2026-06-28","hiringOrganization":{"@type":"Organization","name":"White Circle","sameAs":"https://whitecircle.ai","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/47738230-7285-4809-a4e0-73286292aadf/2b16866c-d889-4afd-b367-ac062dbfeb65/9e085e66-898e-454d-9829-2df9ad5c7218.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Paris","addressRegion":"Île-de-France","addressCountry":"France"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":[{"@type":"Country","name":"United Kingdom"},{"@type":"Country","name":"France"}]}</script>
