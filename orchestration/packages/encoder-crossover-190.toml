# This is the ONLY place this package's values live. The driver
# `orchestration/units/UBUILD1.build.sh` reads it with
# `--package encoder-crossover-190`:
#
#     bash orchestration/units/UBUILD1.build.sh --package encoder-crossover-190
#
# Every value below is derived from the real tree (scratch/uneutral10/package,
# the 29-file payload whose README titles it "Encoder-crossover-190") and from
# the real driver (the built-in default block and its guards). Values genuinely
# shared with the built-in default package are marked SHARED and say why.
# Schema and rationale: strategy/PACKAGE_BUILD.md.
#
# Paths are $SRC-relative unless they start with `/`, in which case they are
# absolute. They are expanded by the driver; nothing here is guessed from disk.
# =============================================================================
schema = 1
slug = "encoder-crossover-190"

# The directory name emitted at $DEST/packages/<name>/. Derived from the payload
# itself: scratch/uneutral10/package/README.md:1 titles the package
# "Encoder-crossover-190". Deliberately distinct from the built-in default's
# name (`exp12-encoder-crossover`), which is the historical path for the same
# payload; this manifest makes the emitted directory match the paper directory.
