    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Agent Infrastructure (IC)","description":"<h2>About Matter Intelligence</h2><p style=\"min-height:1.5em\">Welcome to Matter, where we are building the future of vision AI: pairing a world-first sensor that sees molecular chemistry, temperature, and 3D shape with a Large World Model that will be the most powerful intelligence engine for the physical world. This system doesn't just see what something looks like; it understands everything from a single pixel. We call this Superintelligent Vision.</p><p style=\"min-height:1.5em\">Our team has delivered technologies to Mars for NASA/JPL, designed advanced sensors for U.S. Defense, and frontier artificial intelligence systems. We are now building the next generation of space- and airborne-based sensing systems.</p><h2>About the Role</h2><p style=\"min-height:1.5em\">Matter is hiring an Agent Infrastructure Engineer to build the production systems that turn physics-informed and general-purpose AI into secure, evidence-backed intelligence and action. Reporting to Ignacio Cases Martin, this hands-on individual contributor will work across agent runtimes, reasoning graphs, model routing, retrieval, memory, tools, durable execution, and human approval in partnership with research, platform, product, design, and evaluation teams.</p><h2>Key Responsibilities</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build and operate a production agent runtime that composes physics-informed models, LLMs, VLMs, world models, scientific code, data services, and deterministic business rules through stable interfaces.</p></li><li><p style=\"min-height:1.5em\">Design durable execution with state, planning, tool selection, retries, timeouts, cancellation, checkpoints, provenance, human approval, and recovery.</p></li><li><p style=\"min-height:1.5em\">Build retrieval, RAG, memory, and indexing patterns that respect tenancy, permissions, freshness, versioning, retention, and evidence lineage.</p></li><li><p style=\"min-height:1.5em\">Create evidence-first outputs that distinguish source data, model inference, system-generated synthesis, user input, and unresolved uncertainty.</p></li><li><p style=\"min-height:1.5em\">Integrate continuous evaluation across task success, groundedness, scientific validity, safety, latency, cost, and human intervention.</p></li><li><p style=\"min-height:1.5em\">Partner with product, design, AI platform, Signal and Evaluation, and Telemetry teams to create reusable APIs, tools, and human-in-the-loop workflows without one-off orchestration.</p></li></ul><h2>Qualifications</h2><h3>Required</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience building production agent infrastructure, applied-AI platforms, workflow engines, distributed systems, or complex AI products.</p></li><li><p style=\"min-height:1.5em\">Strong hands-on software engineering skills across architecture, APIs, stateful services, databases, asynchronous execution, testing, debugging, and production operations.</p></li><li><p style=\"min-height:1.5em\">Practical experience with LLMs, VLMs, multimodal systems, RAG, memory, tool use, model routing, structured generation, and common agent failure modes.</p></li><li><p style=\"min-height:1.5em\">Experience building systems with security, permissions, data isolation, auditability, and human approval requirements.</p></li><li><p style=\"min-height:1.5em\">Sound product judgment and the ability to explain uncertain system behavior precisely across technical and non-technical teams.</p></li></ul><h3>Preferred</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with scientific, geospatial, industrial, defense, autonomy, or other high-consequence customer-intelligence systems.</p></li><li><p style=\"min-height:1.5em\">Experience building multimodal applications that combine imagery, time series, maps, documents, structured data, or sensor streams.</p></li><li><p style=\"min-height:1.5em\">Experience with agent evaluation, reinforcement learning or world-model environments, model routing, constrained decoding, or durable workflow systems.</p></li><li><p style=\"min-height:1.5em\">Familiarity with edge or intermittently connected operation, local model execution, or mixed cloud and edge architectures.</p></li></ul><h2>What Success Looks Like</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Production agents generate useful outputs with clear evidence, provenance, uncertainty, and human authority boundaries.</p></li><li><p style=\"min-height:1.5em\">Long-running workflows recover predictably from unavailable models, tools, data, or network connectivity.</p></li><li><p style=\"min-height:1.5em\">Reusable APIs, SDKs, tools, and graph components let teams create new agents without one-off orchestration.</p></li></ul><h2>Location</h2><p style=\"min-height:1.5em\">This role is based in San Francisco, CA, and requires onsite work.</p><h2>ITAR Requirements</h2><p style=\"min-height:1.5em\">To comply with U.S. export regulations, applicants must be one of the following:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A U.S. citizen or national</p></li><li><p style=\"min-height:1.5em\">A lawful permanent resident (green card holder)</p></li><li><p style=\"min-height:1.5em\">Eligible to obtain required authorizations from the U.S. Department of State</p></li></ul><h2>Employee Offerings and Benefits</h2><p style=\"min-height:1.5em\">At Matter, we believe in rewarding high performance and providing the support you need to thrive. Our compensation and benefits package includes:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive compensation based on experience</p></li><li><p style=\"min-height:1.5em\">Early-stage equity package</p></li><li><p style=\"min-height:1.5em\">100% employer-paid health, dental, and vision coverage</p></li><li><p style=\"min-height:1.5em\">Opportunity to work on novel sensing, data, and AI systems with real-world deployment paths to the largest industries in the world</p></li></ul><p style=\"min-height:1.5em\">Matter Intelligence is an equal opportunity employer. We welcome candidates from all backgrounds who can raise the ambition and performance of the team.</p>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Matter Intelligence","value":"433bb3f3-8167-4fb7-a890-4a6c1e31e104"},"datePosted":"2026-09-15","hiringOrganization":{"@type":"Organization","name":"Matter Intelligence","sameAs":"https://matter.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/511e8667-fe87-4558-b7e3-af50403e817f/4d4603e1-33d6-4575-9012-a4c62f6d11b5/cf887999-9ffb-42d6-9a95-f0682cf2491a.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"United States"}},"employmentType":"FULL_TIME"}</script>
