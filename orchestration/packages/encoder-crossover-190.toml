# --- the emitted repository --------------------------------------------------
# SHARED: one publish repository holds every package under packages/*/. The
# build is always invoked with an explicit DEST (this unit's is under
# scratch/urelease3/), never against the real destination.
dest_default = "/home/zer0null/research-publish-packages"

# --- which sanitised tree is promoted, and which is the frozen alternative ---
# SHARED with the built-in default: scratch/uneutral10/package IS this paper's
# released payload (29 files; MANIFEST.json "subset": "encoder-crossover-190").
# The frozen alternative is the pre-promotion sanitised tree on disk.
