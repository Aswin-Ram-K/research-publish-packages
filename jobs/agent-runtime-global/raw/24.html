    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Data Infra - Signals and Evaluations (IC)","description":"<h2>About Matter Intelligence</h2><p style=\"min-height:1.5em\">Welcome to Matter, where we are building the future of vision AI: pairing a world-first sensor that sees molecular chemistry, temperature, and 3D shape with a Large World Model that will be the most powerful intelligence engine for the physical world. This system doesn't just see what something looks like; it understands everything from a single pixel. We call this Superintelligent Vision.</p><p style=\"min-height:1.5em\">Our team has delivered technologies to Mars for NASA/JPL, designed advanced sensors for U.S. Defense, and frontier artificial intelligence systems. We are now building the next generation of space- and airborne-based sensing systems.</p><h2>About the Role</h2><p style=\"min-height:1.5em\">Matter is hiring a Signal, Data, and Evaluation Engineer to build the datasets, benchmarks, environments, and evidence that make our models and AI systems scientifically defensible. Reporting to Ignacio Cases Martin, this individual contributor will work across data curation, simulation and learning environments, model and agent evaluation, and release-quality evidence.</p><h2>Key Responsibilities</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build versioned dataset workflows for collection, curation, filtering, labeling, ground truth, synthetic data, hard-negative mining, contamination controls, and train-evaluation isolation.</p></li><li><p style=\"min-height:1.5em\">Design benchmark suites across perception, multimodal reasoning, physics-informed prediction, retrieval, planning, tool use, world modeling, and customer tasks.</p></li><li><p style=\"min-height:1.5em\">Create simulation and environment infrastructure for reinforcement learning, imitation learning, offline learning, model-based learning, and agent training.</p></li><li><p style=\"min-height:1.5em\">Define repeatable evaluation methods across accuracy, calibration, generalization, robustness, safety, latency, cost, and operational outcomes.</p></li><li><p style=\"min-height:1.5em\">Turn field, mission, and customer failures into versioned datasets, benchmark cases, adversarial tests, and environment scenarios.</p></li><li><p style=\"min-height:1.5em\">Build automated promotion gates and communicate clearly what has been tested, what remains unproven, and what evidence supports release.</p></li></ul><h2>Qualifications</h2><h3>Required</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience in ML evaluation, dataset engineering, reinforcement-learning environments, simulation, scientific ML, test infrastructure, or production AI systems.</p></li><li><p style=\"min-height:1.5em\">Strong foundations in statistics, experimental design, benchmark validity, distribution shift, calibration, reward design, and evidence-based acceptance.</p></li><li><p style=\"min-height:1.5em\">Fluency in Python and modern machine-learning frameworks, with the software engineering discipline to build tested modules, data contracts, or services.</p></li><li><p style=\"min-height:1.5em\">Experience converting qualitative model or agent failures into reproducible datasets, tests, or environment scenarios.</p></li><li><p style=\"min-height:1.5em\">Ability to reason across the complete data path and identify how acquisition, transformation, indexing, orchestration, and presentation affect correctness.</p></li></ul><h3>Preferred</h3><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with dataset curation, benchmark platforms, deep reinforcement learning, world models, synthetic data, multimodal evaluation, or scientific validation.</p></li><li><p style=\"min-height:1.5em\">Experience with PyTorch or JAX, distributed evaluation, experiment tracking, environment frameworks, or model and agent observability.</p></li><li><p style=\"min-height:1.5em\">Experience with uncertainty quantification, calibration, out-of-distribution detection, conformal methods, or selective prediction.</p></li><li><p style=\"min-height:1.5em\">Experience evaluating models deployed to aircraft, satellites, robotics, industrial systems, or other constrained environments.</p></li></ul><h2>What Success Looks Like</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Model and agent releases are supported by reproducible datasets, benchmarks, and clearly stated evidence.</p></li><li><p style=\"min-height:1.5em\">Failures from experiments and deployments become durable test cases that improve future systems.</p></li><li><p style=\"min-height:1.5em\">Evaluation results preserve scientific meaning and make capability, uncertainty, and residual risk legible to the team.</p></li></ul><h2>Location</h2><p style=\"min-height:1.5em\">This role is based in San Francisco, CA, and requires onsite work.</p><h2>ITAR Requirements</h2><p style=\"min-height:1.5em\">To comply with U.S. export regulations, applicants must be one of the following:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A U.S. citizen or national</p></li><li><p style=\"min-height:1.5em\">A lawful permanent resident (green card holder)</p></li><li><p style=\"min-height:1.5em\">Eligible to obtain required authorizations from the U.S. Department of State</p></li></ul><h2>Employee Offerings and Benefits</h2><p style=\"min-height:1.5em\">At Matter, we believe in rewarding high performance and providing the support you need to thrive. Our compensation and benefits package includes:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive compensation based on experience</p></li><li><p style=\"min-height:1.5em\">Early-stage equity package</p></li><li><p style=\"min-height:1.5em\">100% employer-paid health, dental, and vision coverage</p></li><li><p style=\"min-height:1.5em\">Opportunity to work on novel sensing, data, and AI systems with real-world deployment paths to the largest industries in the world</p></li></ul><p style=\"min-height:1.5em\">Matter Intelligence is an equal opportunity employer. We welcome candidates from all backgrounds who can raise the ambition and performance of the team.</p>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Matter Intelligence","value":"fe389053-eb62-4329-a71d-3573dcdc49a8"},"datePosted":"2026-09-15","hiringOrganization":{"@type":"Organization","name":"Matter Intelligence","sameAs":"https://matter.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/511e8667-fe87-4558-b7e3-af50403e817f/4d4603e1-33d6-4575-9012-a4c62f6d11b5/cf887999-9ffb-42d6-9a95-f0682cf2491a.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"United States"}},"employmentType":"FULL_TIME"}</script>
