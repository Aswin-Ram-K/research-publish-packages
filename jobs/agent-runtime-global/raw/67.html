    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"AI Evaluation Engineer - Proofline","description":"<p style=\"min-height:1.5em\"><strong>About Us</strong></p><p style=\"min-height:1.5em\">Meraki Labs (founded by Mukesh Bansal &amp; Peeyush Ranjan) builds and rapidly scales AI-first, \"moonshot\" startups. We're looking for a high-velocity, production-grade engineer to build 0-to-1 products alongside founders.</p><p style=\"min-height:1.5em\"><strong>About the Role</strong></p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.google.com/url?q=http://aavishkar.ai/proofline&amp;source=gmail&amp;ust=1786050541429000&amp;sa=E\">Proofline</a> is live in production with institutional pilots underway. Building with AI is easy to prototype, but proving reliability in production is a major challenge. In AI-native codebases, verification is the key bottleneck for scaling capabilities. As an AI Evaluation Engineer, you will take ownership of the evaluation scaffolding and quality layer, including eval harnesses for AI-facing features, test infrastructure, and release gates. You’ll play a critical role in monitoring how our product behaves across AI assistants (e.g., Claude, ChatGPT), accounting for differences by host and continual changes.</p><p style=\"min-height:1.5em\"><br />AI Evaluation Engineer — Evals &amp; Systems Verification</p><p style=\"min-height:1.5em\">Location: HSR, Bengaluru (On-site) </p><p style=\"min-height:1.5em\">Experience: 5+ years<br /></p><p style=\"min-height:1.5em\"><strong>Responsibilities</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build and maintain evaluation harnesses for AI-facing features to measure and tune system quality (e.g., capture quality, retrieval quality, guidance quality)</p></li><li><p style=\"min-height:1.5em\">Own end-to-end and API test infrastructure (Playwright-class), supporting a continuous, daily-release cycle</p></li><li><p style=\"min-height:1.5em\">Design and execute host-behavior probes using scripted user sessions across diverse AI assistants, ensuring product behavior aligns with expectations</p></li><li><p style=\"min-height:1.5em\">Gate production releases through thorough user acceptance testing (UAT), regression analysis, and quality reporting<br /></p></li></ul><p style=\"min-height:1.5em\"><strong>Requirements</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Background in SDET/QA automation or ML evaluation, with proven ownership of test or evaluation infrastructure and not just executing tests</p></li><li><p style=\"min-height:1.5em\">Strong programming skills in Python or TypeScript, with experience in API-level testing and tools like Playwright or Cypress</p></li><li><p style=\"min-height:1.5em\">Familiarity with LLM applications or a demonstrated interest in evaluating non-deterministic systems</p></li><li><p style=\"min-height:1.5em\">Highly autonomous and able to define your own workflows and processes for evaluation and verification</p></li></ul><p style=\"min-height:1.5em\"><br /><strong>How We Work</strong></p><p style=\"min-height:1.5em\">Small team, high trust, written decisions. Designs get adversarial review before code; PRs get automated review driven to zero open findings; features aren't done until verified on a live system. AI agents do a large share of the implementation—your leverage is judgment: framing the problem, freezing the right design, and knowing when the machine is wrong.<br /></p><p style=\"min-height:1.5em\"><strong>You Should Apply If</strong></p><p style=\"min-height:1.5em\">• You enjoy turning messy problems into concrete solutions.</p><p style=\"min-height:1.5em\">• You thrive in fast-moving, low-process environments.</p><p style=\"min-height:1.5em\">• You're excited about production engineering (monitoring, reliability, cost, latency).<br /></p><p style=\"min-height:1.5em\"><strong>You Should Not Apply If</strong></p><p style=\"min-height:1.5em\">• You want remote/hybrid (this is onsite Bangalore only).</p><p style=\"min-height:1.5em\">• You prefer narrow tickets and minimal ambiguity.</p><p style=\"min-height:1.5em\">• You prefer highly structured, slow-moving product organizations.<br /></p><p style=\"min-height:1.5em\">The Recruiter for this role is Ritesh Kalvellu. Apply to the role directly, and he will get back to you if your profile is relevant to the hiring requirements.</p>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Meraki-Labs","value":"02a8eecd-af9d-4231-8988-6f91f53dca35"},"datePosted":"2026-08-15","hiringOrganization":{"@type":"Organization","name":"Meraki-Labs","sameAs":"https://www.merakilabs.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/1eeae0b6-8760-4bc0-a2c9-6e1b99940516/53938861-0a9e-4197-a46b-748b635b60eb/00edead4-0540-452a-b5dc-4d4d29495541.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Bengaluru","addressRegion":"Karnataka","addressCountry":"India"}},"employmentType":"FULL_TIME"}</script>
