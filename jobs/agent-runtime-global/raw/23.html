    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Agent Harness Engineer - Core Runtime","description":"<p style=\"min-height:1.5em\">NinjaTech AI is a generative AI startup (B2C and B2B) with headquarters in Silicon Valley and offices in Sydney and Vancouver. Backed by Alexa Fund and Samsung Ventures, we are building the autonomous AI agents that let anyone get real work done with generative AI.</p><p style=\"min-height:1.5em\">Our flagship product, SuperNinja, is an advanced agentic AI platform with full OS capabilities: website creation, end-to-end coding, advanced data analysis, and more. The three roles below build the agent harness itself - the runtime, integrations, and reliability layer that every SuperNinja agent runs on.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Position Overview</strong></p><p style=\"min-height:1.5em\">We are looking for a Core Runtime engineer to own the agent harness that turns our LLMs into reliable, autonomous software. The harness is the run loop, orchestrator, and monitor that keep an agent working safely across thousands of tool calls and hours of wall-clock time. You will work at the intersection of systems engineering and applied AI, building the substrate that every SuperNinja agent runs on.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Key Challenges &amp; Opportunities</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and evolve the agent run loop: context management, turn compaction, and recovery from failed or partial tool calls</p></li><li><p style=\"min-height:1.5em\">Build the orchestrator that launches, supervises, and hands off long-running background agents without losing state</p></li><li><p style=\"min-height:1.5em\">Implement the monitoring layer that detects stuck, looping, or runaway agents and intervenes safely</p></li><li><p style=\"min-height:1.5em\">Own the provider abstraction across model backends (Claude, Codex, and others) so the harness stays model-agnostic</p></li><li><p style=\"min-height:1.5em\">Make the harness observable end to end with structured telemetry, so failures are debuggable in production</p></li><li><p style=\"min-height:1.5em\">Keep the loop fast and cheap at scale while it powers millions of daily user interactions</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Experience &amp; Education Requirements</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Master's or Bachelor's in Computer Science or equivalent practical experience</p></li><li><p style=\"min-height:1.5em\">4+ years building production backend or systems software in Python</p></li><li><p style=\"min-height:1.5em\">Strong grasp of concurrency, process supervision, and fault-tolerant design</p></li><li><p style=\"min-height:1.5em\">Experience with LLM APIs and agentic patterns (tool calling, function calling, streaming)</p></li><li><p style=\"min-height:1.5em\">Track record of shipping and operating reliable services at scale</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About the Role</strong></p><p style=\"min-height:1.5em\">You will report to the engineering lead for agent infrastructure and will have ownership in these areas:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Research, design, and build the core run loop and orchestration that power autonomous agents</p></li><li><p style=\"min-height:1.5em\">Define how agents manage context, recover from errors, and hand off work cleanly</p></li><li><p style=\"min-height:1.5em\">Build rapid prototypes and proof of concepts to turn harness ideas into shipped product capabilities</p></li><li><p style=\"min-height:1.5em\">Stay up-to-date with agent architectures from research and industry, and fold the best ideas into our runtime</p></li><li><p style=\"min-height:1.5em\">Design self-healing mechanisms so agents degrade gracefully instead of failing hard</p></li><li><p style=\"min-height:1.5em\">Collaborate with cross-functional teams including applied science, product, and integrations</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What Sets You Apart</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have built an agent framework, workflow engine, or long-running job system before</p></li><li><p style=\"min-height:1.5em\">You care about reliability the way SREs do, and you instrument everything</p></li><li><p style=\"min-height:1.5em\">You can reason about non-determinism in LLM outputs and design around it</p></li><li><p style=\"min-height:1.5em\">Experience with sandboxing, containerization, or secure code execution</p></li><li><p style=\"min-height:1.5em\">You move fast on prototypes but know when to harden them for scale</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Why Join Us</strong></p><p style=\"min-height:1.5em\">This is a chance to build the foundation that every one of our agents runs on. The harness is where autonomy is won or lost, and you will own it end to end alongside a team that values engineering rigor and scientific curiosity.</p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"NinjaTech AI","value":"5fe34e1e-6aa6-400c-b07f-2f1129ca3456"},"datePosted":"2026-08-17","hiringOrganization":{"@type":"Organization","name":"NinjaTech AI","sameAs":"http://ninjatech.ai","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/8c756811-a52b-4741-a751-cfa577ef584b/01f59b4e-c3f7-4f59-ab34-e4b2a80ce549/d27a181c-fcbc-4f4a-99c2-4fdaa9268ae7.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Sydney","addressRegion":"NSW","addressCountry":"Australia"}},"employmentType":"FULL_TIME"}</script>
