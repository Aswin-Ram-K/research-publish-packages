# orchestration/packages/gated-read-batching.toml
# =============================================================================
# MANIFEST for the release package `gated-read-batching` -- emitted as
# `packages/exp12-encoder-crossover/` inside the built repository.
#
# This is the ONLY place this package's values live. The driver
# `orchestration/units/UBUILD1.build.sh` reads it with `--package gated-read-batching`:
#
#     bash orchestration/units/UBUILD1.build.sh --package gated-read-batching
#
# The values below were extracted, byte-for-byte, from the pre-refactor
# UBUILD1.build.sh by `scratch/ubuildall1/refactor.py`, so this manifest
# reproduces exactly what that script produced. Schema and rationale:
# strategy/PACKAGE_BUILD.md.
#
# Paths are $SRC-relative unless they start with `/`, in which case they are
# absolute. They are expanded by the driver; nothing here is guessed from disk.
# =============================================================================
schema = 1
slug = "gated-read-batching"

# The directory name emitted at $DEST/packages/<name>/. Deliberately separate
# from the manifest slug so the manifest can be re-named without moving the
# emitted package.
name = "exp12-encoder-crossover"

# --- the emitted repository --------------------------------------------------
dest_default = "/home/zer0null/research-publish-packages"

# --- which sanitised tree is promoted, and which is the frozen alternative ---
# The promoted tree is staged verbatim; the frozen tree stays reachable through
# SAN_SRC_FROZEN_OVERRIDE=1 so the pre-promotion input remains reproducible.
promoted_san_src = "scratch/uneutral10/package"
frozen_san_src = "repro/encoder-crossover-190-SANITISED"

# --- the licence set ---------------------------------------------------------
# Files copied from the template directory (never retyped) and the sha256 the
# LICENSE copy must have BEFORE the scope clause is appended.
licence_src = "strategy/licence-templates/RELEASED-PIECE"
licence_files = [
  "LICENSE",
  "COMMERCIAL.md",
  "CONTRIBUTING.md",
]
licence_sha256 = "3d364676a91dc579954b585e9d3a3c9f0dc03b723715805cc9431f757ce6f900"

# --- revision anchors, kept on purpose --------------------------------------
# Each anchor must appear in at least one shipped file or the build stops.
anchors = ["907fa39"]

# --- the archive-index row, and the vocabulary -------------------------------
# index_row is this package's row in the destination's root README index. The
# index is assembled from every manifest whose package is present, so a second
# build ADDS a row instead of overwriting the first: it is not a per-package
# README (the package ships its own README.md). Vocabulary fragments live beside
# this manifest and are written VERBATIM into the built tree.
index_row = "| [exp12-encoder-crossover](packages/exp12-encoder-crossover/) | Encoder-crossover-190 data + verification package |"
vocabulary_code = "gated-read-batching/vocabulary-code.txt"
vocabulary_public = "gated-read-batching/vocabulary-public.txt"

# --- local-path neutralisation ----------------------------------------------
# The ONLY transform the build applies: literal path rules, applied and then
# verified. neutralise_forbidden is re-checked afterwards (case-insensitively);
# any survivor stops the build.
neutralise_rules = [
  ["/home/zer0null/Duval/", "<target-repo>/"],
  ["/home/zer0null/Duval", "<target-repo>"],
  ["/home/zer0null", "<user-home>"],
]
neutralise_forbidden = ["/home/zer0null", "duval"]

# --- the commit ---------------------------------------------------------------
commit_subject = "Initial commit: exp12-encoder-crossover data + verification package"

# --- THE SHIP-LIST (fail-closed) ---------------------------------------------
# SHIP_STAGED is the COMPLETE list of staged files, relative to the package
# directory. A staged file that is not listed is DELETED; a listed file that is
# missing is FATAL. Nothing ships by omission.
ship_staged = [
  "COMMERCIAL.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "MANIFEST.json",
  "README.md",
  "fixture/DECISION_CASE_SCHEMA.ts",
